<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ASGE İzmir · Müşteri Takip</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg:#f5f6f8; --card:#fff; --line:#e3e6eb; --text:#1d2330; --muted:#6b7385;
  --accent:#1f5fbf; --accent-soft:#e8f0fb; --red:#c62f2f; --red-soft:#fdecec;
  --amber:#b7791f; --amber-soft:#fdf5e6; --green:#23804a; --green-soft:#e7f5ec;
}
*{box-sizing:border-box}
body{margin:0;font:14px/1.45 -apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--text)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
.hidden{display:none!important}

/* header */
header{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.hbar{display:flex;align-items:center;gap:16px;padding:10px 20px;flex-wrap:wrap}
.brand{font-weight:700;font-size:15px;white-space:nowrap}
.brand span{color:var(--muted);font-weight:500}
nav{display:flex;gap:2px;flex-wrap:wrap}
nav button{background:none;border:0;padding:8px 12px;border-radius:6px;color:var(--muted);font-weight:500}
nav button:hover{background:var(--bg)}
nav button.on{background:var(--accent-soft);color:var(--accent)}
.hright{margin-left:auto;display:flex;align-items:center;gap:8px}
.demo{background:var(--amber-soft);color:var(--amber);padding:6px 20px;font-size:13px;border-bottom:1px solid #f1e0bf}

main{padding:20px;max-width:1500px;margin:0 auto}
h2{font-size:18px;margin:0 0 14px}
h3{font-size:14px;margin:0 0 10px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}

.btn{border:1px solid var(--line);background:#fff;padding:7px 12px;border-radius:6px;font-weight:500}
.btn:hover{border-color:#c9ced8}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.pri:hover{filter:brightness(1.07)}
.btn.danger{color:var(--red)}
.btn.sm{padding:4px 9px;font-size:13px}

.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.toolbar input[type=search]{min-width:240px}
input,select,textarea{border:1px solid var(--line);border-radius:6px;padding:7px 9px;background:#fff;width:100%}
.toolbar input,.toolbar select{width:auto}
textarea{resize:vertical;min-height:60px}
label.f{display:block;font-size:12px;color:var(--muted);margin-bottom:10px}
label.f>input,label.f>select,label.f>textarea{margin-top:3px;font-size:14px}
.rq{color:var(--red)}
.card table{font-size:13px}
.card table th,.card table td{padding:7px 6px;white-space:normal}
.tscroll{overflow-x:auto}

.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px}
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(420px,1fr))}

.kpi .v{font-size:26px;font-weight:700;margin-top:2px}
.kpi .l{font-size:12px;color:var(--muted)}
.kpi.red .v{color:var(--red)}
.kpi.green .v{color:var(--green)}

.list{display:flex;flex-direction:column}
.li{display:flex;gap:10px;align-items:flex-start;padding:9px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.li:last-child{border-bottom:0}
.li:hover{background:#fafbfc}
.li .main{flex:1;min-width:0}
.li .t{font-weight:600}
.li .s{color:var(--muted);font-size:13px;overflow:hidden;text-overflow:ellipsis}
.empty{color:var(--muted);font-size:13px;padding:10px 4px}

.tag{display:inline-block;padding:1px 8px;border-radius:20px;font-size:12px;font-weight:500;background:var(--bg);color:var(--muted);white-space:nowrap}
.tag.red{background:var(--red-soft);color:var(--red)}
.tag.amber{background:var(--amber-soft);color:var(--amber)}
.tag.green{background:var(--green-soft);color:var(--green)}
.tag.blue{background:var(--accent-soft);color:var(--accent)}
.av{display:inline-flex;width:26px;height:26px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-size:11px;font-weight:700;align-items:center;justify-content:center;flex:none}

/* table */
.tbl-wrap{overflow:auto;background:#fff;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:12px;color:var(--muted);font-weight:600;background:#fafbfc;position:sticky;top:0}
tbody tr{cursor:pointer}
tbody tr:hover{background:#fafbfc}
td.num,th.num{text-align:right}
td.wrap{white-space:normal;min-width:200px}

/* kanban */
.kanban{display:flex;gap:12px;overflow-x:auto;padding-bottom:10px;align-items:flex-start}
.col{background:#eceef2;border-radius:10px;min-width:240px;width:240px;flex:none;display:flex;flex-direction:column;max-height:calc(100vh - 190px)}
.col.over{outline:2px dashed var(--accent)}
.colh{padding:10px 12px;font-weight:600;font-size:13px;display:flex;justify-content:space-between;gap:6px}
.colh small{color:var(--muted);font-weight:500}
.cards{padding:0 8px 8px;overflow-y:auto;display:flex;flex-direction:column;gap:8px;min-height:40px}
.kc{background:#fff;border-radius:8px;padding:9px 10px;border:1px solid var(--line);cursor:grab}
.kc:hover{border-color:#c4cad6}
.kc .t{font-weight:600;margin-bottom:3px}
.kc .s{font-size:12px;color:var(--muted)}
.kc .b{display:flex;justify-content:space-between;align-items:center;margin-top:7px;gap:6px}

/* modal */
.ov{position:fixed;inset:0;background:rgba(20,25,35,.45);display:flex;align-items:flex-start;justify-content:center;padding:30px 12px;overflow-y:auto;z-index:50}
.modal{background:#fff;border-radius:12px;width:100%;max-width:980px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.modal.sm{max-width:460px}
.mh{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}
.mh h2{margin:0}
.mb{padding:16px 18px}
.mf{display:flex;gap:8px;justify-content:flex-end;padding:12px 18px;border-top:1px solid var(--line);background:#fafbfc;border-radius:0 0 12px 12px}
.mf .left{margin-right:auto}
.x{background:none;border:0;font-size:22px;color:var(--muted);line-height:1}
.sec{font-size:12px;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.05em;margin:6px 0 10px}
.fg{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:0 14px}
.checks{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;margin-bottom:12px}
.checks label{display:flex;gap:8px;align-items:center;font-size:13px}
.checks input{width:auto}
.err{background:var(--red-soft);color:var(--red);padding:8px 12px;border-radius:6px;margin-bottom:12px;font-size:13px}
.split{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:8px;border-top:1px solid var(--line);padding-top:16px}
.tl{max-height:300px;overflow-y:auto}
.tli{padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}
.tli .m{color:var(--muted);font-size:12px}
.sys{color:var(--muted);font-style:italic}

.bar{height:8px;background:var(--bg);border-radius:4px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent)}

/* login */
.login{max-width:380px;margin:12vh auto;background:#fff;border:1px solid var(--line);border-radius:12px;padding:28px}
.login h1{font-size:19px;margin:0 0 4px}
.login p{color:var(--muted);margin:0 0 18px}

#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1d2330;color:#fff;padding:9px 16px;border-radius:8px;font-size:13px;z-index:80;opacity:0;transition:opacity .2s;pointer-events:none}
#toast.on{opacity:1}

@media (max-width:760px){
  .g2{grid-template-columns:1fr}
  .split{grid-template-columns:1fr}
  main{padding:12px}
  .hbar{padding:10px 12px}
}
</style>
</head>
<body>
<div id="root"></div>
<div id="toast"></div>

<script>
/* =====================================================================
   AYARLAR — Supabase kurulumundan sonra bu iki satırı doldurun.
   (Supabase > Project Settings > API: "Project URL" ve
    "anon public" ya da "publishable" anahtar)
   Boş bırakılırsa uygulama DEMO modunda açılır (veriler sadece bu
   tarayıcıda tutulur).
   ===================================================================== */
const SUPABASE_URL = "https://akickdehbtxrfkzlacft.supabase.co";
const SUPABASE_KEY = "sb_publishable_VWmNSEzMiKkPfQgmJb4zQw_aS5Jm2mj";

/* ----- Aşamalar: sıralama önemli (huni bu sırayla ilerler) ----- */
const ASAMALAR = [
  { k: "aday",     ad: "Aday" },
  { k: "temas",    ad: "İlk temas" },
  { k: "gorusme",  ad: "Yetkiliyle görüşüldü" },
  { k: "uygunluk", ad: "Uygunluk değerlendirme" },
  { k: "teklif",   ad: "Teklif verildi" },
  { k: "sozlesme", ad: "Sözleşme imzalandı" },
  { k: "uygulama", ad: "Başvuru / uygulama" },
  { k: "tamam",    ad: "Tamamlandı", kapali: true },
  { k: "kayip",    ad: "Kaybedildi", kapali: true },
];
const KAYNAKLAR = ["Soğuk arama / ziyaret", "Çözüm ortağı", "Müşteri referansı", "Kişisel çevre", "Web / sosyal medya", "Etkinlik / fuar", "ASGE merkez", "Diğer"];
const ORTAK_TURLERI = ["Makine üreticisi / satıcısı", "Mali müşavir", "Finans danışmanı", "Fuar organizatörü", "İhracat hizmeti", "Sanayi gayrimenkulü", "Diğer"];
const AKTIVITE_TURLERI = ["Arama", "Ziyaret", "Toplantı", "E-posta / WhatsApp", "Teklif sunumu", "Not"];
const KAYIP_NEDENLERI = ["Fiyat", "Yatırım ertelendi", "Finansman bulunamadı", "Uygun destek yok", "Rakibe gitti", "Karar vericiye ulaşılamadı", "Yanıt yok", "Diğer"];
const GORUSME_TURLERI = ["Ziyaret", "Toplantı", "Teklif sunumu"];

/* ===================================================================== */
const DEMO = !/^https:\/\//.test(SUPABASE_URL);
const S = { user: null, members: [], firmalar: [], aktiviteler: [], tahsilatlar: [], ortaklar: [],
            view: "pano", kisi: "", ara: "", fAsama: "", fSorumlu: "", fKaynak: "", donem: 90, kayipGoster: false };
let db;

/* ---------- yardımcılar ---------- */
const $ = (s, el = document) => el.querySelector(s);
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const z = n => String(n).padStart(2, "0");
const ymd = (d = new Date()) => d.getFullYear() + "-" + z(d.getMonth() + 1) + "-" + z(d.getDate());
const addDays = (n, d = new Date()) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const fd = s => { if (!s) return ""; const [y, m, d] = String(s).slice(0, 10).split("-"); return `${d}.${m}.${y}`; };
const fdt = s => { if (!s) return ""; const d = new Date(s); return `${z(d.getDate())}.${z(d.getMonth() + 1)}.${d.getFullYear()} ${z(d.getHours())}:${z(d.getMinutes())}`; };
const tl = n => (n == null || n === "" || isNaN(n)) ? "" : new Intl.NumberFormat("tr-TR", { maximumFractionDigits: 0 }).format(n) + " ₺";
const num = v => { if (v === "" || v == null) return null; const n = Number(String(v).replace(/\./g, "").replace(",", ".")); return isNaN(n) ? null : n; };
const uuid = () => (crypto.randomUUID ? crypto.randomUUID() : "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, c => { const r = Math.random() * 16 | 0; return (c === "x" ? r : (r & 3 | 8)).toString(16); }));
const asama = k => ASAMALAR.find(a => a.k === k) || ASAMALAR[0];
const sira = k => ASAMALAR.findIndex(a => a.k === k);
const acik = f => !asama(f.asama).kapali;
const uyeAd = id => (S.members.find(m => m.user_id === id) || {}).ad || "—";
const bas = ad => (ad || "?").split(/\s+/).map(w => w.replace(/[^\p{L}\p{N}]/gu, "")).filter(Boolean).map(w => w[0]).slice(0, 2).join("").toLocaleUpperCase("tr") || "?";
const puan = f => [f.q_plan, f.q_tarih, f.q_finans, f.q_karar].filter(Boolean).length;
const gecikti = f => acik(f) && f.sonraki_tarih && f.sonraki_tarih < ymd();
const toplamTahsil = id => S.tahsilatlar.filter(t => t.firma_id === id).reduce((a, t) => a + Number(t.tutar || 0), 0);
const sonHareket = f => { const ak = S.aktiviteler.filter(a => a.firma_id === f.id).map(a => a.tarih); return [f.updated_at, f.created_at, ...ak].filter(Boolean).sort().pop(); };
function toast(m) { const t = $("#toast"); t.textContent = m; t.classList.add("on"); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("on"), 2200); }

/* ---------- veri katmanı: Supabase ---------- */
function supaDB() {
  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  const chk = ({ data, error }) => { if (error) throw error; return data; };
  return {
    async session() { const { data } = await sb.auth.getSession(); return data.session ? data.session.user : null; },
    async signIn(email, password) { const { data, error } = await sb.auth.signInWithPassword({ email, password }); if (error) throw error; return data.user; },
    async signOut() { await sb.auth.signOut(); },
    async setPassword(p) { const { error } = await sb.auth.updateUser({ password: p }); if (error) throw error; },
    async all(t) { return chk(await sb.from(t).select("*").limit(10000)); },
    async insert(t, row) { return chk(await sb.from(t).insert(row).select().single()); },
    async update(t, id, patch, key = "id") { return chk(await sb.from(t).update(patch).eq(key, id).select().single()); },
    async remove(t, id) { chk(await sb.from(t).delete().eq("id", id)); },
  };
}

/* ---------- veri katmanı: Demo (tarayıcıda) ---------- */
function demoDB() {
  const KEY = "asge_takip_demo_v1";
  let d;
  try { d = JSON.parse(localStorage.getItem(KEY)); } catch (e) { d = null; }
  if (!d) d = demoVeri();
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(d)); } catch (e) {} };
  save();
  const me = d.team_members[0];
  return {
    async session() { return sessionStorage.getItem("demo_in") ? { id: me.user_id, email: "demo@asge" } : null; },
    async signIn() { sessionStorage.setItem("demo_in", "1"); return { id: me.user_id, email: "demo@asge" }; },
    async signOut() { sessionStorage.removeItem("demo_in"); },
    async setPassword() {},
    async all(t) { return JSON.parse(JSON.stringify(d[t] || [])); },
    async insert(t, row) {
      const now = new Date().toISOString();
      const r = { id: uuid(), created_at: now, ...(t === "firmalar" ? { updated_at: now } : {}), ...row };
      if (t === "aktiviteler" && !r.tarih) r.tarih = now;
      if (!r.kullanici && (t === "aktiviteler" || t === "tahsilatlar")) r.kullanici = me.user_id;
      d[t].push(r); save(); return r;
    },
    async update(t, id, patch, key = "id") {
      const r = d[t].find(x => x[key] === id); Object.assign(r, patch);
      if (t === "firmalar") r.updated_at = new Date().toISOString();
      save(); return r;
    },
    async remove(t, id) {
      d[t] = d[t].filter(x => x.id !== id);
      if (t === "firmalar") { d.aktiviteler = d.aktiviteler.filter(a => a.firma_id !== id); d.tahsilatlar = d.tahsilatlar.filter(a => a.firma_id !== id); }
      save();
    },
  };
}
function demoVeri() {
  const u = [uuid(), uuid(), uuid()];
  const team_members = [{ user_id: u[0], ad: "Eren" }, { user_id: u[1], ad: "Ortak (İzmir)" }, { user_id: u[2], ad: "Uzman" }];
  const o1 = uuid(), o2 = uuid();
  const cozum_ortaklari = [
    { id: o1, ad: "Ege CNC Makine", tur: "Makine üreticisi / satıcısı", yetkili: "Satış Müdürü", telefon: "0232 000 00 00", created_at: addDays(-60).toISOString() },
    { id: o2, ad: "Yıldız Mali Müşavirlik", tur: "Mali müşavir", yetkili: "SMMM", telefon: "0232 000 00 01", created_at: addDays(-50).toISOString() },
  ];
  const F = (ad, asamaK, sorumlu, adim, gun, ek = {}) => ({
    id: uuid(), ad, asama: asamaK, en_ileri: Math.max(0, sira(asamaK === "kayip" ? "gorusme" : asamaK)), sorumlu,
    sonraki_adim: adim, sonraki_tarih: adim ? ymd(addDays(gun)) : null,
    created_at: addDays(-(ek.yas || 30)).toISOString(), updated_at: addDays(-(ek.hareket ?? 3)).toISOString(),
    q_plan: false, q_tarih: false, q_finans: false, q_karar: false, ...ek
  });
  const firmalar = [
    F("Kemalpaşa Döküm A.Ş.", "teklif", u[1], "Teklif üzerine karar görüşmesi", -2, { sektor: "Metal döküm", il_ilce: "Kemalpaşa", kaynak: "Çözüm ortağı", ortak_id: o1, ihtiyac: "2 adet CNC tezgâh yatırımı", program: "Yatırım teşvik belgesi", butce: 8500000, teklif_tutari: 180000, q_plan: true, q_tarih: true, q_finans: true, q_karar: true, yas: 40 }),
    F("Torbalı Plastik Ltd.", "uygunluk", u[2], "Makine listesini al, uygunluk raporu hazırla", 2, { sektor: "Plastik enjeksiyon", il_ilce: "Torbalı", kaynak: "Çözüm ortağı", ortak_id: o2, ihtiyac: "Kapasite artışı", butce: 3000000, q_plan: true, q_tarih: true, yas: 20 }),
    F("Ege Tekstil İhracat", "gorusme", u[1], "Fuar takvimini ve bütçeyi iste", 4, { sektor: "Tekstil", il_ilce: "Bornova", kaynak: "Kişisel çevre", ihtiyac: "Yurt dışı fuar katılımı", program: "Fuar desteği", q_plan: true, yas: 12 }),
    F("Menemen Seramik", "temas", u[1], "Genel müdürden randevu al", -6, { sektor: "Seramik", il_ilce: "Menemen", kaynak: "Soğuk arama / ziyaret", yas: 45, hareket: 35 }),
    F("Çiğli Elektronik", "sozlesme", u[0], "Başvuru dosyası için evrak listesi gönder", 1, { sektor: "Elektronik", il_ilce: "Çiğli AOSB", kaynak: "Müşteri referansı", ihtiyac: "Ar-Ge projesi", program: "Ar-Ge destekleri", teklif_tutari: 250000, sozlesme_tutari: 240000, q_plan: true, q_tarih: true, q_finans: true, q_karar: true, yas: 70 }),
    F("Gaziemir Gıda", "aday", u[2], "İlk arama", 0, { sektor: "Gıda", il_ilce: "Gaziemir", kaynak: "Etkinlik / fuar", yas: 3 }),
    F("Aliağa Kimya", "kayip", u[1], null, 0, { sektor: "Kimya", kaynak: "Soğuk arama / ziyaret", kayip_nedeni: "Yatırım ertelendi", yas: 80 }),
  ];
  const aktiviteler = [], tahsilatlar = [];
  firmalar.forEach(f => {
    aktiviteler.push({ id: uuid(), firma_id: f.id, tur: "Aşama", yeni_asama: f.asama, aciklama: "Kayıt oluşturuldu → " + asama(f.asama).ad, tarih: f.created_at, kullanici: f.sorumlu });
  });
  aktiviteler.push({ id: uuid(), firma_id: firmalar[0].id, tur: "Ziyaret", aciklama: "Fabrika ziyareti, yatırım planı konuşuldu", tarih: addDays(-10).toISOString(), kullanici: u[1] });
  aktiviteler.push({ id: uuid(), firma_id: firmalar[4].id, tur: "Toplantı", aciklama: "Sözleşme imzalandı", tarih: addDays(-5).toISOString(), kullanici: u[0] });
  tahsilatlar.push({ id: uuid(), firma_id: firmalar[4].id, tarih: ymd(addDays(-4)), tutar: 60000, aciklama: "Peşinat (%25)", kullanici: u[0] });
  return { team_members, cozum_ortaklari, firmalar, aktiviteler, tahsilatlar };
}

/* ---------- yükleme ---------- */
async function yukle() {
  const [m, f, a, t, o] = await Promise.all(["team_members", "firmalar", "aktiviteler", "tahsilatlar", "cozum_ortaklari"].map(x => db.all(x)));
  S.members = m.sort((x, y) => x.ad.localeCompare(y.ad, "tr"));
  S.firmalar = f; S.aktiviteler = a; S.tahsilatlar = t; S.ortaklar = o.sort((x, y) => x.ad.localeCompare(y.ad, "tr"));
}

async function basla() {
  try {
    db = DEMO ? demoDB() : supaDB();
  } catch (e) {
    $("#root").innerHTML = `<div class="login"><h1>Bağlantı kurulamadı</h1><p>${esc(e.message)}</p></div>`; return;
  }
  S.user = await db.session();
  if (!S.user) return girisEkrani();
  try { await yukle(); } catch (e) { return hataEkrani(e); }
  if (!S.members.some(m => m.user_id === S.user.id)) {
    $("#root").innerHTML = `<div class="login"><h1>Erişim yok</h1><p>Bu hesap (${esc(S.user.email)}) ekip listesinde tanımlı değil. Yöneticinin sizi team_members tablosuna eklemesi gerekiyor.</p><button class="btn" onclick="cikis()">Çıkış</button></div>`;
    return;
  }
  ciz();
}
function hataEkrani(e) {
  $("#root").innerHTML = `<div class="login"><h1>Veri okunamadı</h1><p>${esc(e.message || e)}</p><p>SQL kurulum dosyası çalıştırıldı mı?</p><button class="btn" onclick="cikis()">Çıkış</button></div>`;
}

function girisEkrani(hata) {
  $("#root").innerHTML = `
  <form class="login" onsubmit="girisYap(event)">
    <h1>ASGE İzmir · Müşteri Takip</h1>
    <p>${DEMO ? "Demo modu: herhangi bir bilgiyle girebilirsiniz." : "Ekip hesabınızla giriş yapın."}</p>
    ${hata ? `<div class="err">${esc(hata)}</div>` : ""}
    <label class="f">E-posta<input name="e" type="email" ${DEMO ? "" : "required"} autocomplete="username"></label>

  </form>`;

async function girisYap(ev) {
  ev.preventDefault();

}
async function cikis() { await db.signOut(); S.user = null; girisEkrani(); }

async function yenile(sessiz) {
  try { await yukle(); ciz(); if (!sessiz) toast("Güncellendi"); }
  catch (e) { toast("Yenilenemedi: " + e.message); }
}

/* ---------- ana çizim ---------- */
const SEKMELER = [["pano", "Pano"], ["huni", "Huni"], ["firmalar", "Firmalar"], ["ortaklar", "Çözüm ortakları"], ["rapor", "Rapor"]];
function ciz() {
  const me = S.members.find(m => m.user_id === S.user.id);
  $("#root").innerHTML = `
  <header>
    ${DEMO ? `<div class="demo">Demo modu — örnek verilerle çalışıyor, kayıtlar yalnızca bu tarayıcıda tutulur. Supabase bilgileri girilince ortak veri tabanına bağlanır. <a href="#" onclick="demoSifirla();return false">Örnek verileri sıfırla</a></div>` : ""}
    <div class="hbar">
      <div class="brand">ASGE İzmir <span>· Müşteri Takip</span></div>
      <nav>${SEKMELER.map(([k, ad]) => `<button class="${S.view === k ? "on" : ""}" onclick="git('${k}')">${ad}</button>`).join("")}</nav>
      <div class="hright">
        <button class="btn pri" onclick="firmaAc()">+ Yeni firma</button>
        <button class="btn" title="Yenile" onclick="yenile()">⟳</button>
        <button class="btn" onclick="hesapAc()"><span class="av" style="width:20px;height:20px;font-size:10px;vertical-align:-5px">${esc(bas(me && me.ad))}</span> ${esc(me ? me.ad : "")}</button>
      </div>
    </div>
  </header>
  <main id="main"></main>`;
  ({ pano: pano, huni: huni, firmalar: firmaListe, ortaklar: ortakListe, rapor: rapor })[S.view]();
}
function git(v) { S.view = v; ciz(); window.scrollTo(0, 0); }
function demoSifirla() { if (confirm("Demo verileri silinip örnek veriler yeniden yüklensin mi?")) { localStorage.removeItem("asge_takip_demo_v1"); db = demoDB(); yenile(true); } }

const kisiSec = () => `<select onchange="S.kisi=this.value;ciz()"><option value="">Herkes</option>${S.members.map(m => `<option value="${m.user_id}" ${S.kisi === m.user_id ? "selected" : ""}>${esc(m.ad)}</option>`).join("")}</select>`;
const kisiFiltre = f => !S.kisi || f.sorumlu === S.kisi;

function firmaSatir(f, sag) {
  return `<div class="li" onclick="firmaAc('${f.id}')">
    <span class="av" title="${esc(uyeAd(f.sorumlu))}">${esc(bas(uyeAd(f.sorumlu)))}</span>
    <div class="main"><div class="t">${esc(f.ad)} <span class="tag">${esc(asama(f.asama).ad)}</span></div>
    <div class="s">${esc(f.sonraki_adim || "Sonraki adım yok")}</div></div>
    <div>${sag || ""}</div></div>`;
}
function tarihTag(f) {
  if (!f.sonraki_tarih) return `<span class="tag red">Tarih yok</span>`;
  const t = ymd();
  if (f.sonraki_tarih < t) { const g = Math.round((new Date(t) - new Date(f.sonraki_tarih)) / 864e5); return `<span class="tag red">${g} gün gecikti</span>`; }
  if (f.sonraki_tarih === t) return `<span class="tag amber">Bugün</span>`;
  return `<span class="tag">${fd(f.sonraki_tarih)}</span>`;
}

/* ---------- PANO ---------- */
function pano() {
  const ac = S.firmalar.filter(f => acik(f) && kisiFiltre(f));
  const t = ymd(), hafta = ymd(addDays(7)), ay = addDays(-30).toISOString();
  const gecikenler = ac.filter(f => !f.sonraki_tarih || f.sonraki_tarih < t).sort((a, b) => (a.sonraki_tarih || "").localeCompare(b.sonraki_tarih || ""));
  const buHafta = ac.filter(f => f.sonraki_tarih && f.sonraki_tarih >= t && f.sonraki_tarih <= hafta).sort((a, b) => a.sonraki_tarih.localeCompare(b.sonraki_tarih));
  const durgun = ac.filter(f => (sonHareket(f) || "") < ay).sort((a, b) => (sonHareket(a) || "").localeCompare(sonHareket(b) || ""));
  const tah30 = S.tahsilatlar.filter(x => x.tarih >= ymd(addDays(-30))).filter(x => { const f = S.firmalar.find(y => y.id === x.firma_id); return !S.kisi || (f && f.sorumlu === S.kisi); }).reduce((a, x) => a + Number(x.tutar || 0), 0);
  const firmaIds = new Set(S.firmalar.filter(kisiFiltre).map(f => f.id));
  const sonAkt = S.aktiviteler.filter(a => firmaIds.has(a.firma_id)).sort((a, b) => b.tarih.localeCompare(a.tarih)).slice(0, 12);

  $("#main").innerHTML = `
  <div class="toolbar"><h2 style="margin:0;margin-right:auto">Haftalık pano</h2>${kisiSec()}</div>
  <div class="grid g4" style="margin-bottom:16px">
    <div class="card kpi"><div class="l">Açık fırsat</div><div class="v">${ac.length}</div></div>
    <div class="card kpi ${gecikenler.length ? "red" : ""}"><div class="l">Gecikmiş / tarihsiz adım</div><div class="v">${gecikenler.length}</div></div>
    <div class="card kpi"><div class="l">Önümüzdeki 7 gün</div><div class="v">${buHafta.length}</div></div>
    <div class="card kpi green"><div class="l">Son 30 gün tahsilat</div><div class="v">${tl(tah30) || "0 ₺"}</div></div>
  </div>
  <div class="grid g2">
    <div class="card"><h3>Gecikenler</h3><div class="list">${gecikenler.map(f => firmaSatir(f, tarihTag(f))).join("") || `<div class="empty">Gecikmiş adım yok.</div>`}</div></div>
    <div class="card"><h3>Bugün ve önümüzdeki 7 gün</h3><div class="list">${buHafta.map(f => firmaSatir(f, tarihTag(f))).join("") || `<div class="empty">Planlanmış adım yok.</div>`}</div></div>
    <div class="card"><h3>30+ gündür hareketsiz</h3><div class="list">${durgun.map(f => firmaSatir(f, `<span class="tag amber">${fd(sonHareket(f))}</span>`)).join("") || `<div class="empty">Hareketsiz kayıt yok.</div>`}</div></div>
    <div class="card"><h3>Son hareketler</h3><div class="list">${sonAkt.map(a => { const f = S.firmalar.find(x => x.id === a.firma_id) || {}; return `<div class="li" onclick="firmaAc('${a.firma_id}')"><span class="av">${esc(bas(uyeAd(a.kullanici)))}</span><div class="main"><div class="t">${esc(f.ad)} <span class="tag ${a.tur === "Aşama" ? "blue" : ""}">${esc(a.tur)}</span></div><div class="s">${esc(a.aciklama)}</div></div><div class="tag">${fd(a.tarih)}</div></div>`; }).join("") || `<div class="empty">Henüz kayıt yok.</div>`}</div></div>
  </div>`;
}

/* ---------- HUNİ (kanban) ---------- */
function huni() {
  const kolonlar = ASAMALAR.filter(a => S.kayipGoster || a.k !== "kayip");
  const fs = S.firmalar.filter(kisiFiltre);
  $("#main").innerHTML = `
  <div class="toolbar"><h2 style="margin:0;margin-right:auto">Satış hunisi</h2>
    <label class="row" style="font-size:13px;gap:6px"><input type="checkbox" style="width:auto" ${S.kayipGoster ? "checked" : ""} onchange="S.kayipGoster=this.checked;ciz()"> Kaybedilenleri göster</label>
    ${kisiSec()}</div>
  <p style="color:var(--muted);margin:-6px 0 12px;font-size:13px">Kartları sürükleyerek aşama değiştirebilirsiniz.</p>
  <div class="kanban">${kolonlar.map(a => {
    const kart = fs.filter(f => f.asama === a.k).sort((x, y) => (x.sonraki_tarih || "9").localeCompare(y.sonraki_tarih || "9"));
    const top = kart.reduce((s, f) => s + Number(f.sozlesme_tutari || f.teklif_tutari || 0), 0);
    return `<div class="col" data-k="${a.k}" ondragover="event.preventDefault();this.classList.add('over')" ondragleave="this.classList.remove('over')" ondrop="birak(event,'${a.k}')">
      <div class="colh"><span>${a.ad} · ${kart.length}</span><small>${top ? tl(top) : ""}</small></div>
      <div class="cards">${kart.map(f => `<div class="kc" draggable="true" ondragstart="event.dataTransfer.setData('text',  '${f.id}')" onclick="firmaAc('${f.id}')">
        <div class="t">${esc(f.ad)}</div>
        <div class="s">${esc(f.sonraki_adim || (a.kapali ? (f.kayip_nedeni || "") : "Sonraki adım yok"))}</div>
        <div class="b"><span class="av" title="${esc(uyeAd(f.sorumlu))}">${esc(bas(uyeAd(f.sorumlu)))}</span>${a.kapali ? "" : tarihTag(f)}</div>
      </div>`).join("")}</div></div>`;
  }).join("")}</div>`;
}
async function birak(ev, k) {
  ev.preventDefault();
  document.querySelectorAll(".col").forEach(c => c.classList.remove("over"));
  const id = ev.dataTransfer.getData("text").trim();
  const f = S.firmalar.find(x => x.id === id);
  if (!f || f.asama === k) return;
  const yeni = { ...f, asama: k };
  if (k === "tamam") { yeni.sonraki_adim = null; yeni.sonraki_tarih = null; }
  const hata = dogrula(yeni);
  if (hata) { firmaAc(id, { asama: k }, hata); return; }
  await firmaKaydetVeri(f, { asama: k, ...(k === "tamam" ? { sonraki_adim: null, sonraki_tarih: null } : {}) });
}

/* ---------- FİRMALAR (tablo) ---------- */
function filtreliFirmalar() {
  const q = S.ara.toLocaleLowerCase("tr");
  return S.firmalar.filter(f =>
    (!S.fAsama || (S.fAsama === "_acik" ? acik(f) : f.asama === S.fAsama)) &&
    (!S.fSorumlu || f.sorumlu === S.fSorumlu) &&
    (!S.fKaynak || f.kaynak === S.fKaynak) &&
    (!q || [f.ad, f.sektor, f.il_ilce, f.yetkili, f.ihtiyac, f.program, f.notlar].join(" ").toLocaleLowerCase("tr").includes(q))
  ).sort((a, b) => sira(a.asama) - sira(b.asama) || (a.sonraki_tarih || "9").localeCompare(b.sonraki_tarih || "9"));
}
function firmaListe() {
  const fs = filtreliFirmalar();
  $("#main").innerHTML = `
  <div class="toolbar">
    <h2 style="margin:0;margin-right:auto">Firmalar <span style="color:var(--muted);font-weight:500">(${fs.length})</span></h2>
    <input type="search" placeholder="Ara: firma, sektör, ihtiyaç..." value="${esc(S.ara)}" oninput="S.ara=this.value;tabloGuncelle()">
    <select onchange="S.fAsama=this.value;ciz()"><option value="">Tüm aşamalar</option><option value="_acik" ${S.fAsama === "_acik" ? "selected" : ""}>Sadece açık</option>${ASAMALAR.map(a => `<option value="${a.k}" ${S.fAsama === a.k ? "selected" : ""}>${a.ad}</option>`).join("")}</select>
    <select onchange="S.fSorumlu=this.value;ciz()"><option value="">Tüm sorumlular</option>${S.members.map(m => `<option value="${m.user_id}" ${S.fSorumlu === m.user_id ? "selected" : ""}>${esc(m.ad)}</option>`).join("")}</select>
    <select onchange="S.fKaynak=this.value;ciz()"><option value="">Tüm kaynaklar</option>${KAYNAKLAR.map(k => `<option ${S.fKaynak === k ? "selected" : ""}>${k}</option>`).join("")}</select>
    <button class="btn" onclick="excelAktar()">Excel'e aktar</button>
  </div>
  <div class="tbl-wrap"><table><thead><tr>
    <th>Firma</th><th>Sektör</th><th>Aşama</th><th>Sorumlu</th><th>Sonraki adım</th><th>Tarih</th><th title="Plan, tarih/bütçe, finansman, karar verici">Puan</th><th class="num">Teklif</th><th class="num">Tahsil</th>
  </tr></thead><tbody id="tbody">${tabloSatirlari(fs)}</tbody></table></div>`;
}
function tabloSatirlari(fs) {
  return fs.map(f => `<tr onclick="firmaAc('${f.id}')">
    <td><b>${esc(f.ad)}</b><div style="color:var(--muted);font-size:12px">${esc(f.il_ilce || "")}</div></td>
    <td>${esc(f.sektor || "")}</td>
    <td><span class="tag ${f.asama === "kayip" ? "red" : f.asama === "tamam" ? "green" : "blue"}">${esc(asama(f.asama).ad)}</span></td>
    <td>${esc(uyeAd(f.sorumlu))}</td>
    <td class="wrap">${esc(f.sonraki_adim || (f.asama === "kayip" ? f.kayip_nedeni || "" : ""))}</td>
    <td>${acik(f) ? tarihTag(f) : ""}</td>
    <td>${puanTag(f)}</td>
    <td class="num">${tl(f.sozlesme_tutari || f.teklif_tutari)}</td>

  </tr>`).join("") || `<tr><td colspan="9" class="empty">Kayıt bulunamadı.</td></tr>`;
}
function tabloGuncelle() { const tb = $("#tbody"); if (tb) tb.innerHTML = tabloSatirlari(filtreliFirmalar()); }
const puanTag = f => { const p = puan(f); return `<span class="tag ${p >= 3 ? "green" : p === 2 ? "amber" : ""}">${p}/4</span>`; };

function excelAktar() {
  const sutun = [["Firma", f => f.ad], ["Sektör", f => f.sektor], ["İl/İlçe", f => f.il_ilce], ["Yetkili", f => f.yetkili], ["Telefon", f => f.telefon], ["E-posta", f => f.eposta],
    ["Kaynak", f => f.kaynak], ["Çözüm ortağı", f => (S.ortaklar.find(o => o.id === f.ortak_id) || {}).ad], ["İhtiyaç", f => f.ihtiyac], ["Program", f => f.program],
    ["Yatırım tarihi", f => fd(f.yatirim_tarihi)], ["Bütçe", f => f.butce], ["Puan (4)", f => puan(f)], ["Aşama", f => asama(f.asama).ad], ["Sorumlu", f => uyeAd(f.sorumlu)],
    ["Sonraki adım", f => f.sonraki_adim], ["Adım tarihi", f => fd(f.sonraki_tarih)], ["Teklif", f => f.teklif_tutari], ["Sözleşme", f => f.sozlesme_tutari],
    ["Tahsil edilen", f => toplamTahsil(f.id)], ["Kayıp nedeni", f => f.kayip_nedeni], ["Notlar", f => f.notlar], ["Oluşturma", f => fd(f.created_at)]];
  const h = v => { v = v == null ? "" : String(v); return /[";\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
  const csv = "﻿" + [sutun.map(s => s[0]).join(";"), ...filtreliFirmalar().map(f => sutun.map(s => h(s[1](f))).join(";"))].join("\r\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv;charset=utf-8" }));
  a.download = `asge-izmir-firmalar-${ymd()}.csv`; a.click();
}

/* ---------- FİRMA PENCERESİ ---------- */
function dogrula(f) {
  if (!f.ad || !f.ad.trim()) return "Firma adı zorunlu.";
  if (f.asama === "kayip" && !f.kayip_nedeni) return "Kaybedildi olarak işaretlemek için kayıp nedeni seçin.";
  if (acik(f)) {
    if (!f.sorumlu) return "Açık bir kayıt için sorumlu kişi seçin.";
    if (!f.sonraki_adim || !f.sonraki_adim.trim()) return "Sonraki adımı yazın (ör. \"Perşembe makine listesi gelecek, cuma uygunluk görüşmesi\").";
    if (!f.sonraki_tarih) return "Sonraki adımın tarihini girin.";
  }
  return null;
}
function sec(name, liste, val, bos = "Seçin") {
  return `<select name="${name}"><option value="">${bos}</option>${liste.map(x => { const [v, t] = Array.isArray(x) ? x : [x, x]; return `<option value="${esc(v)}" ${String(val ?? "") === String(v) ? "selected" : ""}>${esc(t)}</option>`; }).join("")}</select>`;
}

        <label class="f">Teklif tutarı (₺)<input name="teklif_tutari" inputmode="decimal" value="${esc(f.teklif_tutari ?? "")}"></label>
        <label class="f">Sözleşme tutarı (₺)<input name="sozlesme_tutari" inputmode="decimal" value="${esc(f.sozlesme_tutari ?? "")}"></label>

      </div>
      <label class="f">Notlar<textarea name="notlar">${esc(f.notlar)}</textarea></label>

      ${id ? `
      <div class="split">
        <div>
          <div class="sec">Görüşme kayıtları</div>
          <div class="row" style="margin-bottom:6px;align-items:flex-start">
            <select id="akTur" style="width:150px">${AKTIVITE_TURLERI.map(t => `<option>${t}</option>`).join("")}</select>
            <input id="akTarih" type="date" value="${ymd()}" style="width:150px">
          </div>
          <textarea id="akNot" placeholder="Ne konuşuldu? Sonuç ne?" style="margin-bottom:6px"></textarea>
          <div style="font-size:12px;color:var(--muted);margin-bottom:6px">Kaydederken yukarıdaki "Sonraki adım" ve tarihini de güncelleyin.</div>
          <button type="button" class="btn sm" onclick="aktiviteEkle('${id}')">Görüşmeyi ekle</button>
          <div class="tl" style="margin-top:10px">${akt.map(a => `<div class="tli ${a.tur === "Aşama" ? "sys" : ""}"><b>${esc(a.tur)}</b> · ${esc(a.aciklama)}<div class="m">${fdt(a.tarih)} · ${esc(uyeAd(a.kullanici))}${a.tur !== "Aşama" ? ` · <a href="#" onclick="aktiviteSil('${a.id}','${id}');return false">sil</a>` : ""}</div></div>`).join("") || `<div class="empty">Kayıt yok.</div>`}</div>
        </div>
        <div>
          <div class="sec">Tahsilatlar <span style="color:var(--text)">${tl(tah.reduce((s, t) => s + Number(t.tutar || 0), 0)) || ""}</span></div>
          <div class="row" style="margin-bottom:6px">
            <input id="thTarih" type="date" value="${ymd()}" style="width:150px">
            <input id="thTutar" placeholder="Tutar ₺" inputmode="decimal" style="width:130px">
          </div>
          <input id="thAc" placeholder="Açıklama (ör. peşinat, 2. hakediş)" style="margin-bottom:6px">
          <button type="button" class="btn sm" onclick="tahsilatEkle('${id}')">Tahsilat ekle</button>
          <div class="tl" style="margin-top:10px">${tah.map(t => `<div class="tli"><b>${tl(t.tutar)}</b> · ${esc(t.aciklama || "")}<div class="m">${fd(t.tarih)} · ${esc(uyeAd(t.kullanici))} · <a href="#" onclick="tahsilatSil('${t.id}','${id}');return false">sil</a></div></div>`).join("") || `<div class="empty">Tahsilat yok.</div>`}</div>
        </div>
      </div>` : ""}
    </div>
    <div class="mf">
      ${id ? `<button type="button" class="btn danger left" onclick="firmaSil('${id}')">Sil</button>` : ""}
      <button type="button" class="btn" onclick="kapat()">Vazgeç</button>
      <button class="btn pri">Kaydet</button>
    </div>
  </form>`;
  kapat();
  document.body.appendChild(ov); yildiz(ov);
  const fm = $("form", ov);
  const kayipGor = () => { $("#kayipAlan", ov).classList.toggle("hidden", fm.asama.value !== "kayip"); };
  fm.asama.addEventListener("change", kayipGor); kayipGor();
  if (!id) fm.ad.focus();
}
function yildiz(el) { el.querySelectorAll("label.req").forEach(l => { const sp = document.createElement("span"); sp.className = "rq"; sp.textContent = " *"; l.firstChild.after(sp); }); }
function kapat() { const o = $("#firmaOv"); if (o) o.remove(); const o2 = $("#kucukOv"); if (o2) o2.remove(); }
document.addEventListener("keydown", e => { if (e.key === "Escape") kapat(); });

function formOku(fm) {
  const v = n => fm[n].value.trim() || null;
  return {
    ad: fm.ad.value.trim(), sektor: v("sektor"), il_ilce: v("il_ilce"), yetkili: v("yetkili"), telefon: v("telefon"), eposta: v("eposta"),
    kaynak: v("kaynak"), ortak_id: v("ortak_id"), ihtiyac: v("ihtiyac"), program: v("program"), yatirim_tarihi: v("yatirim_tarihi"), butce: num(fm.butce.value),
    q_plan: fm.q_plan.checked, q_tarih: fm.q_tarih.checked, q_finans: fm.q_finans.checked, q_karar: fm.q_karar.checked,
    asama: fm.asama.value, sorumlu: v("sorumlu"), sonraki_adim: v("sonraki_adim"), sonraki_tarih: v("sonraki_tarih"),
    teklif_tutari: num(fm.teklif_tutari.value), sozlesme_tutari: num(fm.sozlesme_tutari.value),
    kayip_nedeni: fm.asama.value === "kayip" ? v("kayip_nedeni") : null, notlar: v("notlar"),
  };
}
function hataGoster(m) { $("#ferr").innerHTML = `<div class="err">${esc(m)}</div>`; $("#firmaOv").scrollTop = 0; }

async function firmaKaydet(ev, id) {
  ev.preventDefault();
  const veri = formOku(ev.target);
  const hata = dogrula(veri);
  if (hata) return hataGoster(hata);
  const btn = $("button.pri", ev.target); btn.disabled = true;
  try {
    if (id) await firmaKaydetVeri(S.firmalar.find(x => x.id === id), veri);
    else {
      veri.en_ileri = veri.asama === "kayip" ? 0 : sira(veri.asama);
      const yeni = await db.insert("firmalar", veri);
      await db.insert("aktiviteler", { firma_id: yeni.id, tur: "Aşama", yeni_asama: yeni.asama, aciklama: "Kayıt oluşturuldu → " + asama(yeni.asama).ad, kullanici: S.user.id });
      await yukle();
    }
    kapat(); ciz(); toast("Kaydedildi");
  } catch (e) { btn.disabled = false; hataGoster("Kaydedilemedi: " + e.message); }
}
async function firmaKaydetVeri(eski, patch) {
  const yeniAsama = patch.asama || eski.asama;
  if (yeniAsama !== eski.asama && yeniAsama !== "kayip") patch.en_ileri = Math.max(eski.en_ileri || 0, sira(yeniAsama));
  if (yeniAsama !== "kayip" && "asama" in patch) patch.kayip_nedeni = null;
  try {
    await db.update("firmalar", eski.id, patch);
    if (yeniAsama !== eski.asama) {
      await db.insert("aktiviteler", { firma_id: eski.id, tur: "Aşama", yeni_asama: yeniAsama, aciklama: `${asama(eski.asama).ad} → ${asama(yeniAsama).ad}${yeniAsama === "kayip" && patch.kayip_nedeni ? " (" + patch.kayip_nedeni + ")" : ""}`, kullanici: S.user.id });
    }
    await yukle(); ciz();
  } catch (e) { toast("Kaydedilemedi: " + e.message); throw e; }
}
async function firmaSil(id) {
  const f = S.firmalar.find(x => x.id === id);
  if (!confirm(`"${f.ad}" ve tüm görüşme/tahsilat kayıtları silinsin mi? Bu işlem geri alınamaz.`)) return;
  try { await db.remove("firmalar", id); await yukle(); kapat(); ciz(); toast("Silindi"); } catch (e) { toast("Silinemedi: " + e.message); }
}
async function aktiviteEkle(id) {
  const not = $("#akNot").value.trim();
  if (!not) { hataGoster("Görüşme notunu yazın."); return; }
  const fm = $("#firmaOv form");
  const veri = formOku(fm);
  const hata = dogrula(veri);
  if (hata) return hataGoster(hata);
  try {
    const t = $("#akTarih").value || ymd();
    const tarih = t === ymd() ? new Date().toISOString() : new Date(t + "T12:00:00").toISOString();
    await db.insert("aktiviteler", { firma_id: id, tur: $("#akTur").value, aciklama: not, tarih, kullanici: S.user.id });
    await firmaKaydetVeri(S.firmalar.find(x => x.id === id), veri);
    firmaAc(id); toast("Görüşme eklendi");
  } catch (e) { hataGoster("Eklenemedi: " + e.message); }
}
async function aktiviteSil(aid, id) { if (!confirm("Bu kayıt silinsin mi?")) return; await db.remove("aktiviteler", aid); await yukle(); ciz(); firmaAc(id); }
async function tahsilatEkle(id) {
  const tutar = num($("#thTutar").value);
  if (!tutar) { hataGoster("Tahsilat tutarını girin."); return; }
  try {
    await db.insert("tahsilatlar", { firma_id: id, tarih: $("#thTarih").value || ymd(), tutar, aciklama: $("#thAc").value.trim() || null, kullanici: S.user.id });
    await yukle(); ciz(); firmaAc(id); toast("Tahsilat eklendi");
  } catch (e) { hataGoster("Eklenemedi: " + e.message); }
}
async function tahsilatSil(tid, id) { if (!confirm("Bu tahsilat silinsin mi?")) return; await db.remove("tahsilatlar", tid); await yukle(); ciz(); firmaAc(id); }

/* ---------- ÇÖZÜM ORTAKLARI ---------- */
function ortakListe() {
  const satir = S.ortaklar.map(o => {
    const fs = S.firmalar.filter(f => f.ortak_id === o.id);
    const soz = fs.filter(f => f.en_ileri >= sira("sozlesme")).length;
    const tah = fs.reduce((s, f) => s + toplamTahsil(f.id), 0);
    return { o, n: fs.length, soz, tah };
  }).sort((a, b) => b.n - a.n);
  $("#main").innerHTML = `
  <div class="toolbar"><h2 style="margin:0;margin-right:auto">Çözüm ortakları</h2><button class="btn pri" onclick="ortakAc()">+ Yeni çözüm ortağı</button></div>
  <p style="color:var(--muted);margin:-6px 0 12px;font-size:13px">Müşterinin yatırım kararını sizden önce gören kişiler: makine satıcıları, mali müşavirler, fuar organizatörleri. Hangi ilişkinin gerçekten iş getirdiğini buradan izleyin.</p>
  <div class="tbl-wrap"><table><thead><tr><th>Ad</th><th>Tür</th><th>Yetkili</th><th>Telefon</th><th class="num">Getirdiği firma</th><th class="num">Sözleşmeye dönen</th><th class="num">Tahsilat</th></tr></thead>
  <tbody>${satir.map(({ o, n, soz, tah }) => `<tr onclick="ortakAc('${o.id}')"><td><b>${esc(o.ad)}</b></td><td>${esc(o.tur || "")}</td><td>${esc(o.yetkili || "")}</td><td>${esc(o.telefon || "")}</td><td class="num">${n}</td><td class="num">${soz}</td><td class="num">${tl(tah)}</td></tr>`).join("") || `<tr><td colspan="7" class="empty">Henüz çözüm ortağı yok.</td></tr>`}</tbody></table></div>`;
}
function ortakAc(id) {
  const o = id ? S.ortaklar.find(x => x.id === id) : {};
  const ov = document.createElement("div");
  ov.className = "ov"; ov.id = "kucukOv";
  ov.onmousedown = e => { if (e.target === ov) kapat(); };
  ov.innerHTML = `<form class="modal sm" onsubmit="ortakKaydet(event,'${id || ""}')">
    <div class="mh"><h2>${id ? esc(o.ad) : "Yeni çözüm ortağı"}</h2><button type="button" class="x" onclick="kapat()">×</button></div>
    <div class="mb"><div id="ferr"></div>
      <label class="f req">Ad<input name="ad" value="${esc(o.ad)}" required></label>
      <label class="f">Tür${sec("tur", ORTAK_TURLERI, o.tur)}</label>
      <label class="f">Yetkili<input name="yetkili" value="${esc(o.yetkili)}"></label>
      <label class="f">Telefon<input name="telefon" value="${esc(o.telefon)}"></label>
      <label class="f">E-posta<input name="eposta" value="${esc(o.eposta)}"></label>
      <label class="f">Notlar (işbirliği şekli, ne zaman görüşüldü)<textarea name="notlar">${esc(o.notlar)}</textarea></label>
    </div>
    <div class="mf">${id ? `<button type="button" class="btn danger left" onclick="ortakSil('${id}')">Sil</button>` : ""}<button type="button" class="btn" onclick="kapat()">Vazgeç</button><button class="btn pri">Kaydet</button></div>
  </form>`;
  kapat(); document.body.appendChild(ov); yildiz(ov); $("input", ov).focus();
}
async function ortakKaydet(ev, id) {
  ev.preventDefault();
  const fm = ev.target, v = n => fm[n].value.trim() || null;
  const veri = { ad: fm.ad.value.trim(), tur: v("tur"), yetkili: v("yetkili"), telefon: v("telefon"), eposta: v("eposta"), notlar: v("notlar") };
  try { if (id) await db.update("cozum_ortaklari", id, veri); else await db.insert("cozum_ortaklari", veri); await yukle(); kapat(); ciz(); toast("Kaydedildi"); }
  catch (e) { $("#ferr").innerHTML = `<div class="err">${esc(e.message)}</div>`; }
}
async function ortakSil(id) {
  if (!confirm("Çözüm ortağı silinsin mi? Bağlı firmalardaki ortak bilgisi boşalır.")) return;
  try {
    await db.remove("cozum_ortaklari", id);
    if (DEMO) for (const f of S.firmalar.filter(f => f.ortak_id === id)) await db.update("firmalar", f.id, { ortak_id: null });
    await yukle(); kapat(); ciz();
  } catch (e) { toast(e.message); }
}

/* ---------- RAPOR ---------- */
function rapor() {
  const bas_ = addDays(-S.donem), basIso = bas_.toISOString(), basYmd = ymd(bas_);
  const ak = S.aktiviteler.filter(a => a.tarih >= basIso);
  const asamaya = k => new Set(ak.filter(a => a.tur === "Aşama" && a.yeni_asama === k).map(a => a.firma_id)).size;
  const yeni = S.firmalar.filter(f => f.created_at >= basIso);
  const gorusme = ak.filter(a => GORUSME_TURLERI.includes(a.tur)).length;
  const teklif = asamaya("teklif"), sozlesme = asamaya("sozlesme"), kayip = asamaya("kayip");
  const tah = S.tahsilatlar.filter(t => t.tarih >= basYmd).reduce((s, t) => s + Number(t.tutar || 0), 0);
  const sozTutar = S.firmalar.filter(f => ak.some(a => a.firma_id === f.id && a.tur === "Aşama" && a.yeni_asama === "sozlesme")).reduce((s, f) => s + Number(f.sozlesme_tutari || 0), 0);

  // kaynağa göre (dönemde oluşturulan firmalar)
  const kay = {};
  yeni.forEach(f => { const k = f.kaynak || "Belirtilmemiş"; kay[k] = kay[k] || { n: 0, tek: 0, soz: 0 }; kay[k].n++; if (f.en_ileri >= sira("teklif")) kay[k].tek++; if (f.en_ileri >= sira("sozlesme")) kay[k].soz++; });
  const kayR = Object.entries(kay).sort((a, b) => b[1].n - a[1].n);
  // kayıp nedenleri
  const kn = {};
  S.firmalar.filter(f => f.asama === "kayip" && (f.updated_at || "") >= basIso).forEach(f => { const k = f.kayip_nedeni || "Belirtilmemiş"; kn[k] = (kn[k] || 0) + 1; });
  const knR = Object.entries(kn).sort((a, b) => b[1] - a[1]); const knMax = Math.max(1, ...knR.map(x => x[1]));
  // açık huni
  const acikF = S.firmalar.filter(acik);
  const huniR = ASAMALAR.filter(a => !a.kapali).map(a => ({ a, n: acikF.filter(f => f.asama === a.k).length, t: acikF.filter(f => f.asama === a.k).reduce((s, f) => s + Number(f.sozlesme_tutari || f.teklif_tutari || 0), 0) }));
  const huniMax = Math.max(1, ...huniR.map(x => x.n));
  // kişiye göre
  const kisiR = S.members.map(m => {
    const fs = acikF.filter(f => f.sorumlu === m.user_id);
    return { m, acik: fs.length, gec: fs.filter(f => !f.sonraki_tarih || f.sonraki_tarih < ymd()).length,
      akt: ak.filter(a => a.kullanici === m.user_id && a.tur !== "Aşama").length,
      soz: new Set(ak.filter(a => a.tur === "Aşama" && a.yeni_asama === "sozlesme" && (S.firmalar.find(f => f.id === a.firma_id) || {}).sorumlu === m.user_id).map(a => a.firma_id)).size };
  });
  const oran = (a, b) => b ? Math.round(a / b * 100) + "%" : "—";

  $("#main").innerHTML = `
  <div class="toolbar"><h2 style="margin:0;margin-right:auto">Rapor</h2>
    <select onchange="S.donem=+this.value;ciz()">${[[30, "Son 30 gün"], [90, "Son 3 ay"], [180, "Son 6 ay"], [365, "Son 12 ay"]].map(([v, t]) => `<option value="${v}" ${S.donem === v ? "selected" : ""}>${t}</option>`).join("")}</select></div>
  <div class="grid g4" style="margin-bottom:16px">
    <div class="card kpi"><div class="l">Yeni aday</div><div class="v">${yeni.length}</div></div>
    <div class="card kpi"><div class="l">Görüşme (ziyaret / toplantı / sunum)</div><div class="v">${gorusme}</div></div>
    <div class="card kpi"><div class="l">Teklif verilen firma</div><div class="v">${teklif}</div></div>
    <div class="card kpi"><div class="l">Sözleşme</div><div class="v">${sozlesme}</div><div class="l">${tl(sozTutar)}</div></div>
    <div class="card kpi green"><div class="l">Tahsilat</div><div class="v">${tl(tah) || "0 ₺"}</div></div>
    <div class="card kpi ${kayip ? "red" : ""}"><div class="l">Kaybedilen</div><div class="v">${kayip}</div></div>
  </div>
  <div class="grid g2">
    <div class="card"><h3>Açık huni (şu an)</h3>
      ${huniR.map(x => `<div style="margin-bottom:9px"><div class="row" style="justify-content:space-between;font-size:13px"><span>${x.a.ad}</span><span><b>${x.n}</b> <span style="color:var(--muted)">${x.t ? "· " + tl(x.t) : ""}</span></span></div><div class="bar"><i style="width:${x.n / huniMax * 100}%"></i></div></div>`).join("")}
    </div>
    <div class="card"><h3>Kayıp nedenleri</h3>
      ${knR.map(([k, n]) => `<div style="margin-bottom:9px"><div class="row" style="justify-content:space-between;font-size:13px"><span>${esc(k)}</span><b>${n}</b></div><div class="bar"><i style="width:${n / knMax * 100}%;background:var(--red)"></i></div></div>`).join("") || `<div class="empty">Bu dönemde kayıp yok.</div>`}
    </div>
    <div class="card"><h3>Kaynağa göre dönüşüm (dönemde eklenen adaylar)</h3>
      <div class="tscroll"><table><thead><tr><th>Kaynak</th><th class="num">Aday</th><th class="num">Teklife ulaşan</th><th class="num">Sözleşmeye ulaşan</th><th class="num">Oran</th></tr></thead>
      <tbody>${kayR.map(([k, x]) => `<tr style="cursor:default"><td>${esc(k)}</td><td class="num">${x.n}</td><td class="num">${x.tek}</td><td class="num">${x.soz}</td><td class="num">${oran(x.soz, x.n)}</td></tr>`).join("") || `<tr><td colspan="5" class="empty">Veri yok.</td></tr>`}</tbody></table></div>
    </div>
    <div class="card"><h3>Kişiye göre</h3>
      <div class="tscroll"><table><thead><tr><th>Kişi</th><th class="num">Açık kayıt</th><th class="num">Geciken</th><th class="num">Dönem görüşme</th><th class="num">Dönem sözleşme</th></tr></thead>
      <tbody>${kisiR.map(x => `<tr style="cursor:default"><td>${esc(x.m.ad)}</td><td class="num">${x.acik}</td><td class="num" style="${x.gec ? "color:var(--red);font-weight:600" : ""}">${x.gec}</td><td class="num">${x.akt}</td><td class="num">${x.soz}</td></tr>`).join("")}</tbody></table></div>
    </div>
  </div>
  <p style="color:var(--muted);font-size:12px;margin-top:14px">Teklif / sözleşme / kayıp sayıları, dönem içinde o aşamaya geçirilen firma sayısıdır. Doğru rapor için aşamaların zamanında güncellenmesi gerekir.</p>`;
}

/* ---------- HESAP ---------- */
function hesapAc() {
  const me = S.members.find(m => m.user_id === S.user.id) || {};
  const ov = document.createElement("div");
  ov.className = "ov"; ov.id = "kucukOv";
  ov.onmousedown = e => { if (e.target === ov) kapat(); };
  ov.innerHTML = `<form class="modal sm" onsubmit="hesapKaydet(event)">
    <div class="mh"><h2>Hesabım</h2><button type="button" class="x" onclick="kapat()">×</button></div>
    <div class="mb"><div id="ferr"></div>
      <label class="f">Görünen ad<input name="ad" value="${esc(me.ad)}" required></label>
      <label class="f">Yeni şifre (değiştirmeyecekseniz boş bırakın)<input name="p" type="password" minlength="8" autocomplete="new-password"></label>
      <div style="font-size:12px;color:var(--muted)">${esc(S.user.email || "")}</div>
    </div>
    <div class="mf"><button type="button" class="btn left" onclick="cikis()">Çıkış yap</button><button type="button" class="btn" onclick="kapat()">Vazgeç</button><button class="btn pri">Kaydet</button></div>
  </form>`;
  kapat(); document.body.appendChild(ov);
}
async function hesapKaydet(ev) {
  ev.preventDefault();
  const fm = ev.target;
  try {
    await db.update("team_members", S.user.id, { ad: fm.ad.value.trim() }, "user_id");
    if (fm.p.value) await db.setPassword(fm.p.value);
    await yukle(); kapat(); ciz(); toast("Kaydedildi");
  } catch (e) { $("#ferr").innerHTML = `<div class="err">${esc(e.message)}</div>`; }
}

/* sekmeye dönünce verileri tazele (diğer kullanıcıların değişiklikleri) */
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && S.user && !$(".ov")) yenile(true); });
setInterval(() => { if (S.user && document.visibilityState === "visible" && !$(".ov")) yenile(true); }, 120000);

basla();
</script>
</body>
</html>
