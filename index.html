<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ASGE İzmir · Müşteri Takip</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg:#f5f6f8; --card:#fff; --line:#e3e6eb; --text:#1d2330; --muted:#6b7385;
  --accent:#1f5fbf; --accent-soft:#e8f0fb; --red:#c62f2f; --red-soft:#fdecec;
  --amber:#b7791f; --amber-soft:#fdf5e6; --green:#23804a; --green-soft:#e7f5ec;
}
*{box-sizing:border-box}
body{margin:0;font:14px/1.45 -apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--text)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
.hidden{display:none!important}

/* header */
header{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.hbar{display:flex;align-items:center;gap:16px;padding:10px 20px;flex-wrap:wrap}
.brand{font-weight:700;font-size:15px;white-space:nowrap}
.brand span{color:var(--muted);font-weight:500}
nav{display:flex;gap:2px;flex-wrap:wrap}
nav button{background:none;border:0;padding:8px 12px;border-radius:6px;color:var(--muted);font-weight:500}
nav button:hover{background:var(--bg)}
nav button.on{background:var(--accent-soft);color:var(--accent)}
.hright{margin-left:auto;display:flex;align-items:center;gap:8px}
.demo{background:var(--amber-soft);color:var(--amber);padding:6px 20px;font-size:13px;border-bottom:1px solid #f1e0bf}

main{padding:20px;max-width:1500px;margin:0 auto}
h2{font-size:18px;margin:0 0 14px}
h3{font-size:14px;margin:0 0 10px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}

.btn{border:1px solid var(--line);background:#fff;padding:7px 12px;border-radius:6px;font-weight:500}
.btn:hover{border-color:#c9ced8}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.pri:hover{filter:brightness(1.07)}
.btn.danger{color:var(--red)}
.btn.sm{padding:4px 9px;font-size:13px}

.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.toolbar input[type=search]{min-width:240px}
input,select,textarea{border:1px solid var(--line);border-radius:6px;padding:7px 9px;background:#fff;width:100%}
.toolbar input,.toolbar select{width:auto}
textarea{resize:vertical;min-height:60px}
label.f{display:block;font-size:12px;color:var(--muted);margin-bottom:10px}
label.f>input,label.f>select,label.f>textarea{margin-top:3px;font-size:14px}
.rq{color:var(--red)}
.card table{font-size:13px}
.card table th,.card table td{padding:7px 6px;white-space:normal}
.tscroll{overflow-x:auto}

.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px}
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(420px,1fr))}

.kpi .v{font-size:26px;font-weight:700;margin-top:2px}
.kpi .l{font-size:12px;color:var(--muted)}
.kpi.red .v{color:var(--red)}
.kpi.green .v{color:var(--green)}
.kpi.amber .v{color:var(--amber)}

.list{display:flex;flex-direction:column}
.li{display:flex;gap:10px;align-items:flex-start;padding:9px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.li:last-child{border-bottom:0}
.li:hover{background:#fafbfc}
.li .main{flex:1;min-width:0}
.li .t{font-weight:600}
.li .s{color:var(--muted);font-size:13px;overflow:hidden;text-overflow:ellipsis}
.empty{color:var(--muted);font-size:13px;padding:10px 4px}

.tag{display:inline-block;padding:1px 8px;border-radius:20px;font-size:12px;font-weight:500;background:var(--bg);color:var(--muted);white-space:nowrap}
.tag.red{background:var(--red-soft);color:var(--red)}
.tag.amber{background:var(--amber-soft);color:var(--amber)}
.tag.green{background:var(--green-soft);color:var(--green)}
.tag.blue{background:var(--accent-soft);color:var(--accent)}
.av{display:inline-flex;width:26px;height:26px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-size:11px;font-weight:700;align-items:center;justify-content:center;flex:none}

/* table */
.tbl-wrap{overflow:auto;background:#fff;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:12px;color:var(--muted);font-weight:600;background:#fafbfc;position:sticky;top:0}
tbody tr{cursor:pointer}
tbody tr:hover{background:#fafbfc}
td.num,th.num{text-align:right}
td.wrap{white-space:normal;min-width:200px}

/* kanban */
.kanban{display:flex;gap:12px;overflow-x:auto;padding-bottom:10px;align-items:flex-start}
.col{background:#eceef2;border-radius:10px;min-width:240px;width:240px;flex:none;display:flex;flex-direction:column;max-height:calc(100vh - 190px)}
.col.over{outline:2px dashed var(--accent)}
.colh{padding:10px 12px;font-weight:600;font-size:13px;display:flex;justify-content:space-between;gap:6px}
.colh small{color:var(--muted);font-weight:500}
.cards{padding:0 8px 8px;overflow-y:auto;display:flex;flex-direction:column;gap:8px;min-height:40px}
.kc{background:#fff;border-radius:8px;padding:9px 10px;border:1px solid var(--line);cursor:grab}
.kc:hover{border-color:#c4cad6}
.kc .t{font-weight:600;margin-bottom:3px}
.kc .s{font-size:12px;color:var(--muted)}
.kc .b{display:flex;justify-content:space-between;align-items:center;margin-top:7px;gap:6px}

/* modal */
.ov{position:fixed;inset:0;background:rgba(20,25,35,.45);display:flex;align-items:flex-start;justify-content:center;padding:30px 12px;overflow-y:auto;z-index:50}
.modal{background:#fff;border-radius:12px;width:100%;max-width:980px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.modal.sm{max-width:460px}
.mh{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}
.mh h2{margin:0}
.mb{padding:16px 18px}
.mf{display:flex;gap:8px;justify-content:flex-end;padding:12px 18px;border-top:1px solid var(--line);background:#fafbfc;border-radius:0 0 12px 12px}
.mf .left{margin-right:auto}
.x{background:none;border:0;font-size:22px;color:var(--muted);line-height:1}
.sec{font-size:12px;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.05em;margin:6px 0 10px}
.fg{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:0 14px}
.checks{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;margin-bottom:12px}
.checks label{display:flex;gap:8px;align-items:center;font-size:13px}
.checks input{width:auto}
.err{background:var(--red-soft);color:var(--red);padding:8px 12px;border-radius:6px;margin-bottom:12px;font-size:13px}
.split{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:8px;border-top:1px solid var(--line);padding-top:16px}
.tl{max-height:300px;overflow-y:auto}
.tli{padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}
.tli .m{color:var(--muted);font-size:12px}
.sys{color:var(--muted);font-style:italic}

.tik{cursor:pointer;border-radius:6px;transition:background .12s}
.tik:hover{background:var(--accent-soft)}
.card.tik:hover{border-color:var(--accent)}
tr.tik td{cursor:pointer}
.bar{height:8px;background:var(--bg);border-radius:4px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent)}

/* login */
.login{max-width:380px;margin:12vh auto;background:#fff;border:1px solid var(--line);border-radius:12px;padding:28px}
.login h1{font-size:19px;margin:0 0 4px}
.login p{color:var(--muted);margin:0 0 18px}

#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1d2330;color:#fff;padding:9px 16px;border-radius:8px;font-size:13px;z-index:80;opacity:0;transition:opacity .2s;pointer-events:none}
#toast.on{opacity:1}

@media (max-width:760px){
  .g2{grid-template-columns:1fr}
  .split{grid-template-columns:1fr}
  main{padding:12px}
  .hbar{padding:10px 12px}
}
.sub{color:var(--muted);font-size:12px}
.aciklama{color:var(--muted);margin:-6px 0 12px;font-size:13px}
.hint{background:var(--amber-soft);color:#7a5414;padding:8px 12px;border-radius:6px;margin-bottom:10px;font-size:13px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ozet{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;background:#fafbfc;border:1px solid var(--line);border-radius:8px;padding:10px 14px;margin-bottom:14px}
.ozet b{font-size:16px}
</style>

</head>
<body>
<div id="root"></div>
<div id="toast"></div>
<script>
/* =====================================================================
   AYARLAR — Supabase bağlantı bilgileri
   ===================================================================== */
const SUPABASE_URL = "https://akickdehbtxrfkzlacft.supabase.co";
const SUPABASE_KEY = "sb_publishable_VWmNSEzMiKkPfQgmJb4zQw_aS5Jm2mj";

/* ----- Aşamalar: sıralama önemli (huni bu sırayla ilerler) ----- */
const ASAMALAR = [
  { k: "aday",     ad: "Aday" },
  { k: "temas",    ad: "İlk temas" },
  { k: "gorusme",  ad: "Yetkiliyle görüşüldü" },
  { k: "uygunluk", ad: "Uygunluk değerlendirme" },
  { k: "teklif",   ad: "Teklif verildi" },
  { k: "sozlesme", ad: "Sözleşme imzalandı" },
  { k: "uygulama", ad: "Başvuru / uygulama" },
  { k: "beklemede", ad: "Beklemede", bekle: true },
  { k: "tamam",    ad: "Tamamlandı", kapali: true },
  { k: "kayip",    ad: "Kaybedildi", kapali: true },
];
const MEVCUT = "Mevcut müşteri";
const KAYNAKLAR = ["Soğuk arama / ziyaret", "Çözüm ortağı", "Müşteri referansı", "Kişisel çevre", "Web / sosyal medya", "Etkinlik / fuar", "ASGE merkez", MEVCUT, "Diğer"];
const ORTAK_TURLERI = ["Makine üreticisi / satıcısı", "Mali müşavir", "Finans danışmanı", "Fuar organizatörü", "İhracat hizmeti", "Sanayi gayrimenkulü", "Diğer"];
const AKTIVITE_TURLERI = ["Arama", "Ziyaret", "Toplantı", "E-posta / WhatsApp", "Teklif sunumu", "Not"];
const KAYIP_NEDENLERI = ["Fiyat", "Yatırım ertelendi", "Finansman bulunamadı", "Uygun destek yok", "Rakibe gitti", "Karar vericiye ulaşılamadı", "Yanıt yok", "Diğer"];
const GORUSME_TURLERI = ["Ziyaret", "Toplantı", "Teklif sunumu"];
const TABLOLAR = ["team_members", "firmalar", "isler", "aktiviteler", "tahsilatlar", "cozum_ortaklari"];

/* ===================================================================== */
const DEMO = !/^https:\/\//.test(SUPABASE_URL);
const S = { user: null, members: [], firmalar: [], isler: [], aktiviteler: [], tahsilatlar: [], ortaklar: [],
            view: "pano", kisi: "", ara: "", fAsama: "", fSorumlu: "", fKaynak: "", fAra: "", fFKaynak: "",
            donem: 90, kayipGoster: false, liste: null, rl: null };
let db;

/* ---------- yardımcılar ---------- */
const $ = (s, el = document) => el.querySelector(s);
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const z = n => String(n).padStart(2, "0");
const ymd = (d = new Date()) => d.getFullYear() + "-" + z(d.getMonth() + 1) + "-" + z(d.getDate());
const addDays = (n, d = new Date()) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const fd = s => { if (!s) return ""; const [y, m, d] = String(s).slice(0, 10).split("-"); return `${d}.${m}.${y}`; };
const fdt = s => { if (!s) return ""; const d = new Date(s); return `${z(d.getDate())}.${z(d.getMonth() + 1)}.${d.getFullYear()} ${z(d.getHours())}:${z(d.getMinutes())}`; };
const tl = n => (n == null || n === "" || isNaN(n)) ? "" : new Intl.NumberFormat("tr-TR", { maximumFractionDigits: 0 }).format(n) + " ₺";
const tl0 = n => Number(n) ? tl(n) : "";
const num = v => { if (v === "" || v == null) return null; const n = Number(String(v).replace(/\./g, "").replace(",", ".")); return isNaN(n) ? null : n; };
const uuid = () => (crypto.randomUUID ? crypto.randomUUID() : "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, c => { const r = Math.random() * 16 | 0; return (c === "x" ? r : (r & 3 | 8)).toString(16); }));
const asama = k => ASAMALAR.find(a => a.k === k) || ASAMALAR[0];
const sira = k => ASAMALAR.findIndex(a => a.k === k);
const acik = i => !asama(i.asama).kapali;
const ilerleme = k => (k === "kayip" || k === "beklemede") ? 0 : sira(k);  // beklemede/kayıp huni ilerlemesi sayılmaz
const uyeAd = id => (S.members.find(m => m.user_id === id) || {}).ad || "—";
const bas = ad => (ad || "?").split(/\s+/).map(w => w.replace(/[^\p{L}\p{N}]/gu, "")).filter(Boolean).map(w => w[0]).slice(0, 2).join("").toLocaleUpperCase("tr") || "?";
const puan = i => [i.q_plan, i.q_tarih, i.q_finans, i.q_karar].filter(Boolean).length;
const firmaOf = i => S.firmalar.find(f => f.id === i.firma_id) || {};
const firmaIsleri = fid => S.isler.filter(i => i.firma_id === fid).sort((a, b) => (b.created_at || "").localeCompare(a.created_at || ""));
const tahsilIs = id => S.tahsilatlar.filter(t => t.is_id === id).reduce((a, t) => a + Number(t.tutar || 0), 0);
const tahsilFirma = id => S.tahsilatlar.filter(t => t.firma_id === id).reduce((a, t) => a + Number(t.tutar || 0), 0);
const sonHareket = i => { const ak = S.aktiviteler.filter(a => a.is_id === i.id).map(a => a.tarih); return [i.updated_at, i.created_at, ...ak].filter(Boolean).sort().pop(); };
const isKaynak = i => i.kaynak || firmaOf(i).kaynak || "Belirtilmemiş";
const asamaTag = k => `<span class="tag ${k === "kayip" ? "red" : k === "tamam" ? "green" : k === "beklemede" ? "amber" : "blue"}">${esc(asama(k).ad)}</span>`;
const puanTag = i => { const p = puan(i); return `<span class="tag ${p >= 3 ? "green" : p === 2 ? "amber" : ""}">${p}/4</span>`; };
const yas = f => { if (!f.kurulus_tarihi) return null; const k = new Date(f.kurulus_tarihi), n = new Date(); let y = n.getFullYear() - k.getFullYear(); if (n.getMonth() < k.getMonth() || (n.getMonth() === k.getMonth() && n.getDate() < k.getDate())) y--; return y; };
const kurulusHucre = f => f.kurulus_tarihi ? `${String(f.kurulus_tarihi).slice(0, 4)} <span class="sub">(${yas(f) < 1 ? "1 yıldan az" : yas(f) + " yıl"})</span>` : "";
function toast(m) { const t = $("#toast"); t.textContent = m; t.classList.add("on"); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("on"), 2200); }

/* ---------- veri katmanı: Supabase ---------- */
function supaDB() {
  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  const chk = ({ data, error }) => { if (error) throw error; return data; };
  return {
    async session() { const { data } = await sb.auth.getSession(); return data.session ? data.session.user : null; },
    async signIn(email, password) { const { data, error } = await sb.auth.signInWithPassword({ email, password }); if (error) throw error; return data.user; },
    async signOut() { await sb.auth.signOut(); },
    async setPassword(p) { const { error } = await sb.auth.updateUser({ password: p }); if (error) throw error; },
    async all(t) { return chk(await sb.from(t).select("*").limit(10000)); },
    async insert(t, row) { return chk(await sb.from(t).insert(row).select().single()); },
    async update(t, id, patch, key = "id") { return chk(await sb.from(t).update(patch).eq(key, id).select().single()); },
    async remove(t, id) { chk(await sb.from(t).delete().eq("id", id)); },
  };
}

/* ---------- veri katmanı: Demo (tarayıcıda) ---------- */
function demoDB() {
  const KEY = "asge_takip_demo_v2";
  let d;
  try { d = JSON.parse(localStorage.getItem(KEY)); } catch (e) { d = null; }
  if (!d) d = demoVeri();
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(d)); } catch (e) {} };
  save();
  const me = d.team_members[0];
  return {
    async session() { return sessionStorage.getItem("demo_in") ? { id: me.user_id, email: "demo@asge" } : null; },
    async signIn() { sessionStorage.setItem("demo_in", "1"); return { id: me.user_id, email: "demo@asge" }; },
    async signOut() { sessionStorage.removeItem("demo_in"); },
    async setPassword() {},
    async all(t) { return JSON.parse(JSON.stringify(d[t] || [])); },
    async insert(t, row) {
      const now = new Date().toISOString();
      const r = { id: uuid(), created_at: now, ...((t === "firmalar" || t === "isler") ? { updated_at: now } : {}), ...row };
      if (t === "aktiviteler" && !r.tarih) r.tarih = now;
      if (!r.kullanici && (t === "aktiviteler" || t === "tahsilatlar")) r.kullanici = me.user_id;
      d[t].push(r); save(); return r;
    },
    async update(t, id, patch, key = "id") {
      const r = d[t].find(x => x[key] === id); Object.assign(r, patch);
      if (t === "firmalar" || t === "isler") r.updated_at = new Date().toISOString();
      save(); return r;
    },
    async remove(t, id) {
      d[t] = d[t].filter(x => x.id !== id);
      if (t === "firmalar") { d.isler = d.isler.filter(a => a.firma_id !== id); d.aktiviteler = d.aktiviteler.filter(a => a.firma_id !== id); d.tahsilatlar = d.tahsilatlar.filter(a => a.firma_id !== id); }
      if (t === "isler") { d.aktiviteler = d.aktiviteler.filter(a => a.is_id !== id); d.tahsilatlar = d.tahsilatlar.filter(a => a.is_id !== id); }
      if (t === "cozum_ortaklari") d.firmalar.forEach(f => { if (f.ortak_id === id) f.ortak_id = null; });
      save();
    },
  };
}
function demoVeri() {
  const u = [uuid(), uuid(), uuid()];
  const team_members = [{ user_id: u[0], ad: "Eren" }, { user_id: u[1], ad: "Bora" }, { user_id: u[2], ad: "Serap" }];
  const o1 = uuid(), o2 = uuid();
  const cozum_ortaklari = [
    { id: o1, ad: "Ege CNC Makine", tur: "Makine üreticisi / satıcısı", yetkili: "Satış Müdürü", telefon: "0232 000 00 00", created_at: addDays(-60).toISOString() },
    { id: o2, ad: "Yıldız Mali Müşavirlik", tur: "Mali müşavir", yetkili: "SMMM", telefon: "0232 000 00 01", created_at: addDays(-50).toISOString() },
  ];
  const firmalar = [], isler = [], aktiviteler = [], tahsilatlar = [];
  const F = (ad, ek = {}) => { const f = { id: uuid(), ad, created_at: addDays(-(ek.yas || 30)).toISOString(), updated_at: addDays(-(ek.yas || 30)).toISOString(), ...ek }; delete f.yas; firmalar.push(f); return f; };
  const I = (f, asamaK, sorumlu, adim, gun, ek = {}) => {
    const i = { id: uuid(), firma_id: f.id, asama: asamaK, en_ileri: Math.max(0, sira(asamaK === "kayip" ? "gorusme" : asamaK)), sorumlu,
      sonraki_adim: adim, sonraki_tarih: adim ? ymd(addDays(gun)) : null,
      created_at: addDays(-(ek.yas || 30)).toISOString(), updated_at: addDays(-(ek.hareket ?? 3)).toISOString(),
      q_plan: false, q_tarih: false, q_finans: false, q_karar: false, ...ek };
    delete i.yas; delete i.hareket; isler.push(i);
    aktiviteler.push({ id: uuid(), firma_id: f.id, is_id: i.id, tur: "Aşama", yeni_asama: asamaK, aciklama: "Kayıt oluşturuldu → " + asama(asamaK).ad, tarih: i.created_at, kullanici: sorumlu });
    return i;
  };
  const f1 = F("Kemalpaşa Döküm A.Ş.", { sektor: "Metal döküm", nace_kodu: "24.51.01", il_ilce: "Kemalpaşa", kurulus_tarihi: "2009-03-12", kaynak: "Çözüm ortağı", ortak_id: o1, yas: 40 });

async function yukle() {
  const [m, f, i, a, t, o] = await Promise.all(TABLOLAR.map(x => db.all(x)));

async function basla() {
  try { db = DEMO ? demoDB() : supaDB(); }
  catch (e) { $("#root").innerHTML = `<div class="login"><h1>Bağlantı kurulamadı</h1><p>${esc(e.message)}</p></div>`; return; }
  S.user = await db.session();
  if (!S.user) return girisEkrani();
  try { await yukle(); } catch (e) { return hataEkrani(e); }
  if (!S.members.some(m => m.user_id === S.user.id)) {
    $("#root").innerHTML = `<div class="login"><h1>Erişim yok</h1><p>Bu hesap (${esc(S.user.email)}) ekip listesinde tanımlı değil. Yöneticinin sizi team_members tablosuna eklemesi gerekiyor.</p><button class="btn" onclick="cikis()">Çıkış</button></div>`;
    return;
  }
  ciz();
}
function hataEkrani(e) {

  const durgun = ac.filter(i => (sonHareket(i) || "") < ay).sort((a, b) => (sonHareket(a) || "").localeCompare(sonHareket(b) || ""));

  const firmaIds = new Set(S.kisi ? S.isler.filter(kisiFiltre).map(i => i.firma_id) : S.firmalar.map(f => f.id));

      const f = S.firmalar.find(x => x.id === a.firma_id) || {}; const i = a.is_id ? S.isler.find(x => x.id === a.is_id) : null;

async function birak(ev, k) {
  ev.preventDefault();
  document.querySelectorAll(".col").forEach(c => c.classList.remove("over"));
  const id = ev.dataTransfer.getData("text").trim();
  const i = S.isler.find(x => x.id === id);
  if (!i || i.asama === k) return;
  const patch = { asama: k, ...(k === "tamam" ? { sonraki_adim: null, sonraki_tarih: null } : {}) };
  const hata = isDogrula({ ...i, ...patch });
  if (hata) { isAc(id, { asama: k }, hata); return; }
  await isKaydetVeri(i, patch);
}

/* ---------- Excel ---------- */
function csvIndir(ad, sutun, rows) {
  const h = v => { v = v == null ? "" : String(v); return /[";\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
  const csv = "﻿" + [sutun.map(s => s[0]).join(";"), ...rows.map(r => sutun.map(s => h(s[1](r))).join(";"))].join("\r\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv;charset=utf-8" }));
  a.download = `${ad}-${ymd()}.csv`; a.click();
}
const FIRMA_SUTUN = [["Firma", f => f.ad], ["Sektör", f => f.sektor], ["NACE kodu", f => f.nace_kodu], ["İl/İlçe", f => f.il_ilce], ["Kuruluş tarihi", f => fd(f.kurulus_tarihi)], ["Firma yaşı", f => yas(f)],
  ["Yetkili", f => f.yetkili], ["Telefon", f => f.telefon], ["E-posta", f => f.eposta], ["Kaynak", f => f.kaynak], ["Çözüm ortağı", f => (S.ortaklar.find(o => o.id === f.ortak_id) || {}).ad]];
function islerExcel(rows = filtreliIsler(), ad = "asge-izmir-isler") {
  const F = i => firmaOf(i);
  csvIndir(ad, [...FIRMA_SUTUN.map(([n, fn]) => [n, i => fn(F(i))]),
    ["Program / destek", i => i.program], ["İhtiyaç", i => i.ihtiyac], ["Yatırım tarihi", i => fd(i.yatirim_tarihi)], ["Bütçe", i => i.butce], ["İş kaynağı", i => isKaynak(i)], ["Puan (4)", i => puan(i)],
    ["Aşama", i => asama(i.asama).ad], ["Sorumlu", i => uyeAd(i.sorumlu)], ["Sonraki adım", i => i.sonraki_adim], ["Adım tarihi", i => fd(i.sonraki_tarih)],
    ["Teklif", i => i.teklif_tutari], ["Sözleşme", i => i.sozlesme_tutari], ["Tahsil edilen", i => tahsilIs(i.id)], ["Kayıp nedeni", i => i.kayip_nedeni], ["İş notları", i => i.notlar], ["İş açılış", i => fd(i.created_at)]],
    rows);
}
function firmalarExcel(rows = filtreliFirmalar(), ad = "asge-izmir-firmalar") {
  csvIndir(ad, [...FIRMA_SUTUN, ["İş sayısı", f => firmaIsleri(f.id).length], ["Açık iş", f => firmaIsleri(f.id).filter(acik).length],
    ["Toplam sözleşme", f => firmaIsleri(f.id).reduce((s, i) => s + Number(i.sozlesme_tutari || 0), 0)], ["Toplam tahsil", f => tahsilFirma(f.id)], ["Notlar", f => f.notlar], ["Kayıt tarihi", f => fd(f.created_at)]],
    rows);
}

const normAd = s => (s || "").toLocaleLowerCase("tr").replace(/\b(a\.?ş\.?|ltd\.?|şti\.?|san\.?|tic\.?|ve|limited|şirketi|anonim)\b/g, " ").replace(/[^\p{L}\p{N}]+/gu, " ").trim();

async function yeniKaydet(ev) {
  ev.preventDefault();
  const fm = ev.target, f = firmaOku(fm), i = isOku(fm);

  const btn = $("button.pri", fm); btn.disabled = true;
  try {
    const yf = await db.insert("firmalar", f);
    const yi = await db.insert("isler", { ...i, firma_id: yf.id, kaynak: f.kaynak, en_ileri: ilerleme(i.asama) });
    await db.insert("aktiviteler", { firma_id: yf.id, is_id: yi.id, tur: "Aşama", yeni_asama: yi.asama, aciklama: "Kayıt oluşturuldu → " + asama(yi.asama).ad, kullanici: S.user.id });
    await yukle(); kapat(); ciz(); toast("Kaydedildi");
  } catch (e) { btn.disabled = false; hataGoster("Kaydedilemedi: " + e.message); }
}

    <div class="mh"><div><h2>${esc(f.ad)}</h2><div class="sub" style="margin-top:2px">${id ? esc(i.program || "İş") : "Yeni iş"}${digerAcik ? ` · firmanın ${digerAcik} başka açık işi var` : ""}</div></div>
      <div class="row"><button type="button" class="btn sm" onclick="firmaAc('${i.firma_id}')">Firma kartı</button><button type="button" class="x" onclick="kapat()">×</button></div></div>
    <div class="mb">
      <div id="ferr">${hata ? `<div class="err">${esc(hata)}</div>` : ""}</div>
      ${isAlanlari(i)}
      ${id ? `
      <div class="split">
        <div>
          <div class="sec">Görüşme kayıtları</div>
          ${aktiviteFormu(`isAktiviteEkle('${id}')`, 'Kaydederken yukarıdaki "Sonraki adım" ve tarihini de güncelleyin.')}
          <div class="tl" style="margin-top:10px">${aktiviteListesi(akt, false)}</div>
        </div>
        <div>
          <div class="sec">Tahsilatlar <span style="color:var(--text)">${tl0(tah.reduce((s, t) => s + Number(t.tutar || 0), 0))}</span></div>
          <div class="row" style="margin-bottom:6px">
            <input id="thTarih" type="date" value="${ymd()}" style="width:150px">
            <input id="thTutar" placeholder="Tutar ₺" inputmode="decimal" style="width:130px">
          </div>
          <input id="thAc" placeholder="Açıklama (ör. peşinat, 2. hakediş)" style="margin-bottom:6px">
          <button type="button" class="btn sm" onclick="tahsilatEkle('${id}')">Tahsilat ekle</button>
          <div class="tl" style="margin-top:10px">${tah.map(t => `<div class="tli"><b>${tl(t.tutar)}</b> · ${esc(t.aciklama || "")}<div class="m">${fd(t.tarih)} · ${esc(uyeAd(t.kullanici))} · <a href="#" onclick="tahsilatSil('${t.id}');return false">sil</a></div></div>`).join("") || `<div class="empty">Tahsilat yok.</div>`}</div>
        </div>
      </div>` : ""}
    </div>
    <div class="mf">
      ${id ? `<button type="button" class="btn danger left" onclick="isSil('${id}')">İşi sil</button>` : ""}
      <button type="button" class="btn" onclick="kapat()">Vazgeç</button>
      <button class="btn pri">Kaydet</button>
    </div>
  </form>`);
  if (!id) $("#firmaOv input[name=program]").focus();
}
async function isKaydet(ev, id, fid) {
  ev.preventDefault();
  const veri = isOku(ev.target);
  const h = isDogrula(veri); if (h) return hataGoster(h);
  const btn = $("button.pri", ev.target); btn.disabled = true;
  try {
    if (id) { await isKaydetVeri(S.isler.find(x => x.id === id), veri); kapat(); }
    else {
      const yi = await db.insert("isler", { ...veri, firma_id: fid, en_ileri: ilerleme(veri.asama) });
      await db.insert("aktiviteler", { firma_id: fid, is_id: yi.id, tur: "Aşama", yeni_asama: yi.asama, aciklama: "Yeni iş açıldı → " + asama(yi.asama).ad, kullanici: S.user.id });
      await yukle(); ciz(); firmaAc(fid);
    }
    toast("Kaydedildi");
  } catch (e) { btn.disabled = false; hataGoster("Kaydedilemedi: " + e.message); }
}
async function isKaydetVeri(eski, patch) {
  const yeniAsama = patch.asama || eski.asama;
  if (yeniAsama !== eski.asama) patch.en_ileri = Math.max(eski.en_ileri || 0, ilerleme(yeniAsama));
  if (yeniAsama !== "kayip" && "asama" in patch) patch.kayip_nedeni = null;
  try {
    await db.update("isler", eski.id, patch);
    if (yeniAsama !== eski.asama) {
      await db.insert("aktiviteler", { firma_id: eski.firma_id, is_id: eski.id, tur: "Aşama", yeni_asama: yeniAsama, aciklama: `${asama(eski.asama).ad} → ${asama(yeniAsama).ad}${yeniAsama === "kayip" && patch.kayip_nedeni ? " (" + patch.kayip_nedeni + ")" : ""}`, kullanici: S.user.id });
    }
    await yukle(); ciz();
  } catch (e) { toast("Kaydedilemedi: " + e.message); throw e; }
}
async function isSil(id) {
  const i = S.isler.find(x => x.id === id);
  if (!confirm(`Bu iş (${i.program || "programsız"}) ve görüşme/tahsilat kayıtları silinsin mi? Firma kaydı kalır.`)) return;
  try { await db.remove("isler", id); await yukle(); ciz(); firmaAc(i.firma_id); toast("İş silindi"); } catch (e) { toast("Silinemedi: " + e.message); }
}
async function isAktiviteEkle(id) {
  const not = $("#akNot").value.trim();
  if (!not) return hataGoster("Görüşme notunu yazın.");
  const veri = isOku($("#firmaOv form"));
  const h = isDogrula(veri); if (h) return hataGoster(h);
  try {
    const i = S.isler.find(x => x.id === id);
    await db.insert("aktiviteler", { firma_id: i.firma_id, is_id: id, tur: $("#akTur").value, aciklama: not, tarih: akTarih(), kullanici: S.user.id });
    await isKaydetVeri(i, veri);
    isAc(id); toast("Görüşme eklendi");
  } catch (e) { hataGoster("Eklenemedi: " + e.message); }
}
async function aktiviteSil(aid) {
  if (!confirm("Bu kayıt silinsin mi?")) return;
  const a = S.aktiviteler.find(x => x.id === aid); const isMod = $("#firmaOv form[onsubmit^=isKaydet]");
  await db.remove("aktiviteler", aid); await yukle(); ciz();
  if (isMod && a.is_id) isAc(a.is_id); else firmaAc(a.firma_id);
}
async function tahsilatEkle(id) {
  const tutar = num($("#thTutar").value);
  if (!tutar) return hataGoster("Tahsilat tutarını girin.");
  try {
    const i = S.isler.find(x => x.id === id);
    await db.insert("tahsilatlar", { firma_id: i.firma_id, is_id: id, tarih: $("#thTarih").value || ymd(), tutar, aciklama: $("#thAc").value.trim() || null, kullanici: S.user.id });
    await yukle(); ciz(); isAc(id); toast("Tahsilat eklendi");
  } catch (e) { hataGoster("Eklenemedi: " + e.message); }
}
async function tahsilatSil(tid) {
  if (!confirm("Bu tahsilat silinsin mi?")) return;
  const t = S.tahsilatlar.find(x => x.id === tid);
  await db.remove("tahsilatlar", tid); await yukle(); ciz(); isAc(t.is_id);
}

/* ---------- ÇÖZÜM ORTAKLARI ---------- */
function ortakListe() {
  const satir = S.ortaklar.map(o => {
    const fs = S.firmalar.filter(f => f.ortak_id === o.id);
    const soz = fs.filter(f => firmaIsleri(f.id).some(i => i.en_ileri >= sira("sozlesme"))).length;
    const tah = fs.reduce((s, f) => s + tahsilFirma(f.id), 0);
    return { o, n: fs.length, soz, tah };
  }).sort((a, b) => b.n - a.n);
  $("#main").innerHTML = `
  <div class="toolbar"><h2 style="margin:0;margin-right:auto">Çözüm ortakları</h2><button class="btn pri" onclick="ortakAc()">+ Yeni çözüm ortağı</button></div>
  <p class="aciklama">Müşterinin yatırım kararını sizden önce gören kişiler: makine satıcıları, mali müşavirler, fuar organizatörleri. Hangi ilişkinin gerçekten iş getirdiğini buradan izleyin.</p>
  <div class="tbl-wrap"><table><thead><tr><th>Ad</th><th>Tür</th><th>Yetkili</th><th>Telefon</th><th class="num">Getirdiği firma</th><th class="num">Sözleşmeye dönen</th><th class="num">Tahsilat</th></tr></thead>
  <tbody>${satir.map(({ o, n, soz, tah }) => `<tr onclick="ortakAc('${o.id}')"><td><b>${esc(o.ad)}</b></td><td>${esc(o.tur || "")}</td><td>${esc(o.yetkili || "")}</td><td>${esc(o.telefon || "")}</td><td class="num">${n}</td><td class="num">${soz}</td><td class="num">${tl0(tah)}</td></tr>`).join("") || `<tr><td colspan="7" class="empty">Henüz çözüm ortağı yok.</td></tr>`}</tbody></table></div>`;
}
function ortakAc(id) {
  const o = id ? S.ortaklar.find(x => x.id === id) : {};
  const ov = modalAc(`<form class="modal sm" onsubmit="ortakKaydet(event,'${id || ""}')">
    <div class="mh"><h2>${id ? esc(o.ad) : "Yeni çözüm ortağı"}</h2><button type="button" class="x" onclick="kapat()">×</button></div>
    <div class="mb"><div id="ferr"></div>
      <label class="f req">Ad<input name="ad" value="${esc(o.ad)}" required></label>
      <label class="f">Tür${sec("tur", ORTAK_TURLERI, o.tur)}</label>
      <label class="f">Yetkili<input name="yetkili" value="${esc(o.yetkili)}"></label>
      <label class="f">Telefon<input name="telefon" value="${esc(o.telefon)}"></label>
      <label class="f">E-posta<input name="eposta" value="${esc(o.eposta)}"></label>
      <label class="f">Notlar (işbirliği şekli, ne zaman görüşüldü)<textarea name="notlar">${esc(o.notlar)}</textarea></label>
    </div>
    <div class="mf">${id ? `<button type="button" class="btn danger left" onclick="ortakSil('${id}')">Sil</button>` : ""}<button type="button" class="btn" onclick="kapat()">Vazgeç</button><button class="btn pri">Kaydet</button></div>
  </form>`, "kucukOv");
  $("input", ov).focus();
}
async function ortakKaydet(ev, id) {
  ev.preventDefault();
  const fm = ev.target, v = n => fm[n].value.trim() || null;
  const veri = { ad: fm.ad.value.trim(), tur: v("tur"), yetkili: v("yetkili"), telefon: v("telefon"), eposta: v("eposta"), notlar: v("notlar") };
  try { if (id) await db.update("cozum_ortaklari", id, veri); else await db.insert("cozum_ortaklari", veri); await yukle(); kapat(); ciz(); toast("Kaydedildi"); }
  catch (e) { hataGoster(e.message); }
}
async function ortakSil(id) {
  if (!confirm("Çözüm ortağı silinsin mi? Bağlı firmalardaki ortak bilgisi boşalır.")) return;
  try { await db.remove("cozum_ortaklari", id); await yukle(); kapat(); ciz(); } catch (e) { toast(e.message); }
}

/* ---------- RAPOR ---------- */
function rapor() {
  const bas_ = addDays(-S.donem), basIso = bas_.toISOString(), basYmd = ymd(bas_);
  const L = {}; const reg = (baslik, ids, tip = "is") => { const k = "l" + Object.keys(L).length; L[k] = { baslik, tip, ids: [...new Set(ids)] }; return k; };
  const tik = (baslik, ids, tip) => `class="tik" onclick="raporListe('${reg(baslik, ids, tip)}')"`;
  const ak = S.aktiviteler.filter(a => a.tarih >= basIso);
  const asamaIds = k => ak.filter(a => a.tur === "Aşama" && a.yeni_asama === k && a.is_id).map(a => a.is_id);
  const yeni = S.isler.filter(i => i.created_at >= basIso);
  const gorAk = ak.filter(a => GORUSME_TURLERI.includes(a.tur));
  const teklifI = asamaIds("teklif"), sozI = asamaIds("sozlesme"), kayipI = asamaIds("kayip");
  const say = ids => new Set(ids).size;
  const tahR = S.tahsilatlar.filter(t => t.tarih >= basYmd);
  const tah = tahR.reduce((s, t) => s + Number(t.tutar || 0), 0);
  const sozTutar = S.isler.filter(i => sozI.includes(i.id)).reduce((s, i) => s + Number(i.sozlesme_tutari || 0), 0);
  const mevcutYeni = yeni.filter(i => i.kaynak === MEVCUT);
  const bekI = S.isler.filter(i => i.asama === "beklemede").map(i => i.id);
  const donemAd = { 30: "son 30 gün", 90: "son 3 ay", 180: "son 6 ay", 365: "son 12 ay" }[S.donem] || "";
  const kpi = (l, v, ids, baslik, ek = "", cls = "", tip = "is") => `<div class="card kpi tik ${cls}" onclick="raporListe('${reg(baslik + " (" + donemAd + ")", ids, tip)}')"><div class="l">${l}</div><div class="v">${v}</div>${ek}</div>`;

  const kay = {};
  yeni.forEach(i => { const k = isKaynak(i); kay[k] = kay[k] || { n: [], tek: [], soz: [] }; kay[k].n.push(i.id); if (i.en_ileri >= sira("teklif")) kay[k].tek.push(i.id); if (i.en_ileri >= sira("sozlesme")) kay[k].soz.push(i.id); });
  const kayR = Object.entries(kay).sort((a, b) => b[1].n.length - a[1].n.length);
  const kn = {};
  S.isler.filter(i => i.asama === "kayip" && (i.updated_at || "") >= basIso).forEach(i => { const k = i.kayip_nedeni || "Belirtilmemiş"; (kn[k] = kn[k] || []).push(i.id); });
  const knR = Object.entries(kn).sort((a, b) => b[1].length - a[1].length); const knMax = Math.max(1, ...knR.map(x => x[1].length));
  const acikI = S.isler.filter(acik);
  const huniR = ASAMALAR.filter(a => !a.kapali).map(a => { const is_ = acikI.filter(i => i.asama === a.k); return { a, is_, t: is_.reduce((s, i) => s + Number(i.sozlesme_tutari || i.teklif_tutari || 0), 0) }; });
  const huniMax = Math.max(1, ...huniR.map(x => x.is_.length));
  const oran = (a, b) => b ? Math.round(a / b * 100) + "%" : "—";
  const hucre = (ids, baslik) => `<td class="num"><span ${ids.length ? tik(baslik, ids) : ""} style="display:inline-block;padding:2px 8px">${ids.length}</span></td>`;

  $("#main").innerHTML = `
  <div class="toolbar"><h2 style="margin:0;margin-right:auto">Rapor</h2>
    <select onchange="S.donem=+this.value;ciz()">${[[30, "Son 30 gün"], [90, "Son 3 ay"], [180, "Son 6 ay"], [365, "Son 12 ay"]].map(([v, t]) => `<option value="${v}" ${S.donem === v ? "selected" : ""}>${t}</option>`).join("")}</select></div>
  <p class="aciklama">Rakamlara ve satırlara tıklayarak ilgili işleri listeleyebilirsiniz.</p>
  <div class="grid g4" style="margin-bottom:16px">
    ${kpi("Yeni iş", yeni.length, yeni.map(i => i.id), "Yeni açılan işler", mevcutYeni.length ? `<div class="l">${mevcutYeni.length} tanesi mevcut müşteriden</div>` : "")}
    ${kpi("Görüşme (ziyaret / toplantı / sunum)", gorAk.length, gorAk.map(a => a.firma_id), "Görüşme yapılan firmalar", "", "", "firma")}
    ${kpi("Teklif verilen iş", say(teklifI), teklifI, "Teklif verilen işler")}
    ${kpi("Sözleşme", say(sozI), sozI, "Sözleşme imzalanan işler", `<div class="l">${tl(sozTutar)}</div>`)}
    ${kpi("Tahsilat", tl(tah) || "0 ₺", tahR.map(t => t.is_id).filter(Boolean), "Tahsilat yapılan işler", "", "green")}
    ${kpi("Kaybedilen", say(kayipI), kayipI, "Kaybedilen işler", "", say(kayipI) ? "red" : "")}
    <div class="card kpi tik ${bekI.length ? "amber" : ""}" onclick="raporListe('${reg("Beklemedeki işler (şu an)", bekI)}')"><div class="l">Beklemede (şu an)</div><div class="v">${bekI.length}</div></div>
  </div>
  <div class="grid g2">
    <div class="card"><h3>Açık huni (şu an)</h3>
      ${huniR.map(x => `<div ${tik("Açık huni: " + x.a.ad, x.is_.map(i => i.id))} style="padding:4px 6px;margin:0 -6px 5px"><div class="row" style="justify-content:space-between;font-size:13px"><span>${x.a.ad}</span><span><b>${x.is_.length}</b> <span style="color:var(--muted)">${x.t ? "· " + tl(x.t) : ""}</span></span></div><div class="bar"><i style="width:${x.is_.length / huniMax * 100}%"></i></div></div>`).join("")}
    </div>
    <div class="card"><h3>Kayıp nedenleri</h3>
      ${knR.map(([k, ids]) => `<div ${tik("Kayıp nedeni: " + k, ids)} style="padding:4px 6px;margin:0 -6px 5px"><div class="row" style="justify-content:space-between;font-size:13px"><span>${esc(k)}</span><b>${ids.length}</b></div><div class="bar"><i style="width:${ids.length / knMax * 100}%;background:var(--red)"></i></div></div>`).join("") || `<div class="empty">Bu dönemde kayıp yok.</div>`}
    </div>
    <div class="card"><h3>Kaynağa göre dönüşüm (dönemde açılan işler)</h3>
      <div class="tscroll"><table><thead><tr><th>Kaynak</th><th class="num">İş</th><th class="num">Teklife ulaşan</th><th class="num">Sözleşmeye ulaşan</th><th class="num">Oran</th></tr></thead>
      <tbody>${kayR.map(([k, x]) => `<tr ${tik("Kaynak: " + k, x.n)}><td>${esc(k)}</td>${hucre(x.n, "Kaynak: " + k)}${hucre(x.tek, "Kaynak: " + k + " · teklife ulaşan")}${hucre(x.soz, "Kaynak: " + k + " · sözleşmeye ulaşan")}<td class="num">${oran(x.soz.length, x.n.length)}</td></tr>`).join("") || `<tr><td colspan="5" class="empty">Veri yok.</td></tr>`}</tbody></table></div>
    </div>
  </div>
  <p class="aciklama" style="margin-top:14px;font-size:12px">Teklif / sözleşme / kayıp sayıları, dönem içinde o aşamaya geçirilen iş sayısıdır. "Mevcut müşteri" kaynağı, daha önce iş yapılmış firmalardan açılan yeni işleri gösterir.</p>`;
  S.rl = L;
}
function raporListe(k) { if (window.event) window.event.stopPropagation(); const l = S.rl && S.rl[k]; if (!l) return; S.liste = l; listeCiz(); }
function listeCiz() {
  const l = S.liste; if (!l) return;
  const firma = l.tip === "firma";
  const list = l.ids.map(id => (firma ? S.firmalar : S.isler).find(x => x.id === id)).filter(Boolean);
  let ov = $("#listeOv");
  if (!ov) { ov = document.createElement("div"); ov.className = "ov"; ov.id = "listeOv"; ov.onmousedown = e => { if (e.target === ov) listeKapat(); }; document.body.appendChild(ov); }
  ov.innerHTML = `<div class="modal" style="max-width:1200px">
    <div class="mh"><h2>${esc(l.baslik)} <span style="color:var(--muted);font-weight:500">(${list.length})</span></h2><div class="row"><button type="button" class="btn sm" onclick="listeExcel()" ${list.length ? "" : "disabled"}>Excel'e aktar</button><button type="button" class="x" onclick="listeKapat()">×</button></div></div>
    <div class="mb"><div class="tbl-wrap"><table><thead><tr>${firma ? FIRMA_BASLIK : IS_BASLIK}</tr></thead><tbody>${firma ? firmaTabloSatirlari(list) : isTabloSatirlari(list)}</tbody></table></div>
    <p class="aciklama" style="margin:10px 0 0;font-size:12px">Satıra tıklayarak kaydı açabilirsiniz. Kapatınca bu listeye dönersiniz.</p></div>
  </div>`;
}
function listeExcel() {
  const l = S.liste; if (!l) return;
  const firma = l.tip === "firma";
  const list = l.ids.map(id => (firma ? S.firmalar : S.isler).find(x => x.id === id)).filter(Boolean);
  const ad = "asge-rapor-" + l.baslik.toLocaleLowerCase("tr").replace(/[ıİ]/g, "i").replace(/ş/g, "s").replace(/ğ/g, "g").replace(/ü/g, "u").replace(/ö/g, "o").replace(/ç/g, "c").replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 60);
  firma ? firmalarExcel(list, ad) : islerExcel(list, ad);
}
function listeKapat() { S.liste = null; const o = $("#listeOv"); if (o) o.remove(); }

/* ---------- HESAP ---------- */
function hesapAc() {
  const me = S.members.find(m => m.user_id === S.user.id) || {};
  modalAc(`<form class="modal sm" onsubmit="hesapKaydet(event)">
    <div class="mh"><h2>Hesabım</h2><button type="button" class="x" onclick="kapat()">×</button></div>
    <div class="mb"><div id="ferr"></div>
      <label class="f">Görünen ad<input name="ad" value="${esc(me.ad)}" required></label>
      <label class="f">Yeni şifre (değiştirmeyecekseniz boş bırakın)<input name="p" type="password" minlength="8" autocomplete="new-password"></label>
      <div class="sub">${esc(S.user.email || "")}</div>
    </div>
    <div class="mf"><button type="button" class="btn left" onclick="cikis()">Çıkış yap</button><button type="button" class="btn" onclick="kapat()">Vazgeç</button><button class="btn pri">Kaydet</button></div>
  </form>`, "kucukOv");
}
async function hesapKaydet(ev) {
  ev.preventDefault();
  const fm = ev.target;
  try {
    await db.update("team_members", S.user.id, { ad: fm.ad.value.trim() }, "user_id");
    if (fm.p.value) await db.setPassword(fm.p.value);
    await yukle(); kapat(); ciz(); toast("Kaydedildi");
  } catch (e) { hataGoster(e.message); }
}

/* diğer kullanıcıların değişiklikleri: sekmeye dönünce / 2 dakikada bir */
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && S.user && !$(".ov")) yenile(true); });
setInterval(() => { if (S.user && document.visibilityState === "visible" && !$(".ov")) yenile(true); }, 120000);

basla();
</script>
</body>
</html>
